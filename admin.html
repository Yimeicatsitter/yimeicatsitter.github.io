<!DOCTYPE html>
<html lang="zh"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex"><title>猫咪预约 · 管理后台</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'"><style>
:root{color-scheme:light;
 --bg:#FFF1F7;--card:#FFFFFF;--text:#4A3B5C;--muted:#9A88AD;--border:#FFD3E6;
 --pink:#FF6FA8;--pink2:#FF9BC7;--pinkSoft:#FFE3F0;--blue:#6EC1FF;--blueSoft:#E1F3FF;
 --yellow:#E9A800;--yellowSoft:#FFF3C4;--mint:#22B58A;--mintSoft:#D9F7EB;--coral:#F0446E;--coralSoft:#FFE0E8;--lilac:#B48CFF;}
*{box-sizing:border-box}
html{background:var(--bg);scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;color:var(--text);font-family:"Quicksand",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-weight:600;
 padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);-webkit-text-size-adjust:100%}
.bg{position:fixed;inset:0;z-index:-1;pointer-events:none}
.wrap{max-width:520px;margin:0 auto;padding:22px 16px 70px}
.wrap.wide{max-width:680px}
.head{display:flex;align-items:center;gap:12px;margin-bottom:6px}
h1{font-size:23px;margin:0;color:var(--pink);font-weight:700}
.sub{color:var(--muted);font-size:14px;margin:2px 0 18px}
.card{background:rgba(255,255,255,.96);border:2px solid var(--border);border-radius:22px;padding:18px;margin-bottom:16px;box-shadow:0 8px 24px rgba(255,111,168,.12)}
.card h2{font-size:16px;margin:0 0 14px;color:var(--text);font-weight:700}
label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin:0 0 6px;text-transform:uppercase;letter-spacing:.04em}
.field{margin-bottom:14px}.two{display:flex;gap:10px}.two>*{flex:1;min-width:0}
input[type=date],input[type=text],input[type=password],textarea{width:100%;border:2px solid var(--border);background:#FFFAFD;color:var(--text);border-radius:14px;padding:12px;font-size:16px;font-family:inherit;font-weight:600;outline:none}
input:focus,textarea:focus{border-color:var(--pink2)}
.pills{display:flex;gap:8px;flex-wrap:wrap}
.pill{flex:1 1 0;min-width:88px;text-align:center;padding:11px 8px;border-radius:14px;border:2px solid var(--border);background:#FFFAFD;font-size:14px;font-weight:700;cursor:pointer;user-select:none;transition:.15s}
.pill.active{background:var(--pinkSoft);border-color:var(--pink);color:var(--pink)}
.pill.blue.active{background:var(--blueSoft);border-color:var(--blue);color:#2A8FDA}
button{font-family:inherit;cursor:pointer}
.primary{width:100%;padding:15px;border:none;border-radius:16px;background:linear-gradient(135deg,var(--pink),var(--lilac));color:#fff;font-size:16px;font-weight:700;box-shadow:0 8px 18px rgba(255,111,168,.35);transition:.15s}
.primary:active{transform:scale(.98)}.primary:disabled{opacity:.55}
.info{font-size:13px;color:var(--muted);margin:-4px 0 14px}
.info b{color:var(--pink)}
.sec{font-size:13px;font-weight:700;color:var(--pink);text-transform:uppercase;letter-spacing:.05em;margin:22px 4px 10px}
.chip{display:inline-block;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;margin:0 4px 4px 0}
.chip.p{background:var(--yellowSoft);color:var(--yellow)}.chip.c{background:var(--mintSoft);color:var(--mint)}.chip.r{background:var(--coralSoft);color:var(--coral)}
.badge{font-size:12px;font-weight:700;padding:5px 11px;border-radius:999px;white-space:nowrap}
.badge.pending{background:var(--yellowSoft);color:var(--yellow)}.badge.confirmed{background:var(--mintSoft);color:var(--mint)}
.badge.rejected{background:var(--coralSoft);color:var(--coral)}.badge.partial{background:var(--blueSoft);color:#2A8FDA}
.s{background:rgba(255,255,255,.96);border:2px solid var(--border);border-radius:20px;padding:15px 16px;margin-bottom:12px}
.s .top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.s .rng{font-weight:700;font-size:16px}.s .meta{font-size:13.5px;color:var(--muted);margin:4px 0 8px}
.s .note{font-size:13px;color:var(--muted);font-style:italic;margin-bottom:8px}
details{margin-top:6px}summary{cursor:pointer;font-size:13px;font-weight:700;color:#2A8FDA;padding:4px 0;list-style:none}
summary::-webkit-details-marker{display:none}summary::before{content:"▸ "}details[open] summary::before{content:"▾ "}
.day{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-top:1.5px dashed var(--border);font-size:14px}
.mini{display:flex;gap:6px;align-items:center}
.mini button{padding:6px 10px;border-radius:10px;border:2px solid var(--border);background:#fff;font-size:12.5px;font-weight:700;color:var(--muted)}
.mini .ok{border-color:var(--mint);color:var(--mint);background:var(--mintSoft)}.mini .no{border-color:var(--coral);color:var(--coral);background:var(--coralSoft)}
.ghost{margin-top:6px;background:#fff;border:2px solid var(--border);color:var(--muted);border-radius:12px;padding:8px 13px;font-size:13px;font-weight:700}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 2px}
.acts button{flex:1 1 auto;padding:10px 12px;border-radius:12px;border:2px solid var(--border);background:#fff;color:var(--text);font-size:13.5px;font-weight:700}
.acts .ok{background:var(--mintSoft);border-color:var(--mint);color:var(--mint)}.acts .no{background:var(--coralSoft);border-color:var(--coral);color:var(--coral)}
.acts .del{flex:0 0 auto;color:var(--muted)}
.empty,.err{text-align:center;color:var(--muted);font-size:14px;padding:26px 10px;line-height:1.6}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--mint);color:#fff;padding:12px 20px;border-radius:999px;font-size:14px;font-weight:700;opacity:0;pointer-events:none;transition:.25s;max-width:90vw;text-align:center;z-index:9}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.stat{background:rgba(255,255,255,.96);border:2px solid var(--border);border-radius:18px;padding:12px;text-align:center}
.stat .n{font-size:24px;font-weight:700}.stat .l{font-size:12px;color:var(--muted)}
.stat.p .n{color:var(--yellow)}.stat.c .n{color:var(--mint)}.stat.r .n{color:var(--coral)}
.tabs{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto}
.tab{flex:0 0 auto;padding:9px 15px;border-radius:999px;border:2px solid var(--border);background:#fff;font-size:13.5px;font-weight:700;color:var(--muted);cursor:pointer;white-space:nowrap}
.tab.active{background:linear-gradient(135deg,var(--pink),var(--lilac));border-color:transparent;color:#fff}
.row{display:flex;gap:8px}.row .primary{width:auto;padding:11px 18px;font-size:14px;flex:0 0 auto}
.cl{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-top:1.5px dashed var(--border);font-size:15px}
.cl button{padding:8px 13px;border-radius:12px;border:2px solid var(--blue);background:var(--blueSoft);color:#2A8FDA;font-size:13px;font-weight:700}
</style></head>
<body><svg class="bg" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="100%" height="100%">
<defs><pattern id="cats" width="340" height="340" patternUnits="userSpaceOnUse"><g opacity=".6">
<g transform="translate(62,64) scale(1)">
<path d="M-34 -6 L-30 -42 L-8 -27 Z" fill="#FFB3D1"/><path d="M34 -6 L30 -42 L8 -27 Z" fill="#FFB3D1"/>
<ellipse rx="37" ry="30" fill="#FFB3D1"/>
<circle cx="-13" cy="-3" r="3.2" fill="#6B5A80"/><circle cx="13" cy="-3" r="3.2" fill="#6B5A80"/>
<path d="M-3 5 L3 5 L0 9 Z" fill="#FF6FA8"/>
<path d="M0 9 Q-4 14 -8 11 M0 9 Q4 14 8 11" stroke="#6B5A80" stroke-width="1.6" fill="none" stroke-linecap="round"/>

<circle cx="-23" cy="6" r="4" fill="#FF8FBE" opacity=".55"/><circle cx="23" cy="6" r="4" fill="#FF8FBE" opacity=".55"/></g>

<path d="M26 44 C58 46 62 12 46 0" stroke="#A8DAFF" stroke-width="10" fill="none" stroke-linecap="round"/>
<ellipse cx="0" cy="24" rx="27" ry="33" fill="#A8DAFF"/><circle cx="0" cy="-18" r="21" fill="#A8DAFF"/>

<ellipse cx="4" cy="4" rx="44" ry="24" fill="#FFE49A"/><circle cx="-32" cy="-12" r="18" fill="#FFE49A"/>
<path d="M-48 -22 L-46 -44 L-33 -30 Z" fill="#FFE49A"/><path d="M-16 -22 L-18 -44 L-31 -30 Z" fill="#FFE49A"/>
<path d="M-40 -13 Q-37 -9 -34 -13 M-30 -13 Q-27 -9 -24 -13" stroke="#6B5A80" stroke-width="1.8" fill="none" stroke-linecap="round"/>

<g transform="translate(282,286) scale(0.78)">
<path d="M-34 -6 L-30 -42 L-8 -27 Z" fill="#D9C2FF"/><path d="M34 -6 L30 -42 L8 -27 Z" fill="#D9C2FF"/>
<ellipse rx="37" ry="30" fill="#D9C2FF"/>
<circle cx="-13" cy="-3" r="3.2" fill="#6B5A80"/><circle cx="13" cy="-3" r="3.2" fill="#6B5A80"/>
<path d="M-3 5 L3 5 L0 9 Z" fill="#FF6FA8"/>
<path d="M0 9 Q-4 14 -8 11 M0 9 Q4 14 8 11" stroke="#6B5A80" stroke-width="1.6" fill="none" stroke-linecap="round"/>
<path d="M-24 7 L-42 3 M-24 12 L-42 15 M24 7 L42 3 M24 12 L42 15" stroke="#6B5A80" stroke-width="1.3" stroke-linecap="round"/>
<circle cx="-23" cy="6" r="4" fill="#FF8FBE" opacity=".55"/><circle cx="23" cy="6" r="4" fill="#FF8FBE" opacity=".55"/></g>
<path transform="translate(170,34) scale(0.7)" d="M0 0 C-6 -8 -18 -2 0 14 C18 -2 6 -8 0 0Z" fill="#FF9EC7"/><path transform="translate(176,206) scale(0.6)" d="M0 0 C-6 -8 -18 -2 0 14 C18 -2 6 -8 0 0Z" fill="#9AD4FF"/><path transform="translate(326,196) scale(0.5)" d="M0 0 C-6 -8 -18 -2 0 14 C18 -2 6 -8 0 0Z" fill="#FFC94D"/>
<path transform="translate(20,168) scale(0.5)" d="M0 0 C-6 -8 -18 -2 0 14 C18 -2 6 -8 0 0Z" fill="#FFC94D"/><path transform="translate(214,300) scale(0.55)" d="M0 0 C-6 -8 -18 -2 0 14 C18 -2 6 -8 0 0Z" fill="#FF9EC7"/>
<circle cx="150" cy="120" r="4" fill="#B5F0D8"/><circle cx="20" cy="300" r="4" fill="#9AD4FF"/><circle cx="322" cy="34" r="4" fill="#FFB3D1"/><circle cx="118" cy="176" r="3" fill="#FFE49A"/>
</g></pattern></defs><rect width="100%" height="100%" fill="url(#cats)"/></svg>
<div class="wrap wide" id="app"></div><div class="toast" id="toast"></div>
<script>
const API_URL = "https://script.google.com/macros/s/AKfycbzcWLuB2Yz3xUYrJBfcbInXtJDDFjT-JjB6gk9QvvVLx3PCiwsvHFTt3brVtpcV4o4PWw/exec";
const app = document.getElementById('app');
let key = localStorage.getItem('adminKey') || '';
let data = {clients:[], bookings:[]}, tab = 'pending', shown = false;
const openSet = new Set();

const esc = s => String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const fmt = iso => new Date(iso + 'T00:00:00').toLocaleDateString('zh-CN', {year:'numeric', month:'2-digit', day:'2-digit'});
const wd = iso => new Date(iso + 'T00:00:00').toLocaleDateString('zh-CN', {month:'2-digit', day:'2-digit', weekday:'short'});
const rng = (a,b) => a === b ? fmt(a) : fmt(a) + ' → ' + fmt(b);
const timeTxt = t => t === 'morning' ? '上午' : t === 'evening' ? '傍晚' : '时间不限(egal)';
const freqTxt = (f,t) => f === 'twice' ? '一天两次(上午+傍晚)' : '一天一次 · ' + timeTxt(t);
const stTxt = s => s === 'confirmed' ? '已接受' : s === 'rejected' ? '已拒绝' : '待确认';
function toast(t){ const el = document.getElementById('toast'); el.textContent = t; el.classList.add('show'); setTimeout(()=>el.classList.remove('show'), 2200); }
async function api(p){ const r = await fetch(API_URL + '?' + new URLSearchParams({...p, a:key})); return r.json(); }

function group(list){
  const m = {};
  list.forEach(b => { const k = b.seriesId || b.id; (m[k] = m[k] || {sid:k, days:[]}).days.push(b); });
  return Object.values(m).map(s => {
    s.days.sort((a,b) => a.date.localeCompare(b.date));
    const f = s.days[0];
    s.start = f.date; s.end = s.days[s.days.length-1].date; s.freq = f.freq; s.time = f.time; s.note = f.note; s.name = f.clientName;
    s.c = {pending:0, confirmed:0, rejected:0};
    s.days.forEach(d => { if(s.c[d.status] !== undefined) s.c[d.status]++; });
    return s;
  }).sort((a,b) => a.start.localeCompare(b.start));
}

function loginView(msg){
  app.innerHTML = `<div class="head"><svg viewBox="-46 -46 92 82" width="46" height="42" aria-hidden="true"><g transform="translate(0,0) scale(1)">
<path d="M-34 -6 L-30 -42 L-8 -27 Z" fill="#FFB3D1"/><path d="M34 -6 L30 -42 L8 -27 Z" fill="#FFB3D1"/>
<ellipse rx="37" ry="30" fill="#FFB3D1"/>
<circle cx="-13" cy="-3" r="3.2" fill="#6B5A80"/><circle cx="13" cy="-3" r="3.2" fill="#6B5A80"/>
<path d="M-3 5 L3 5 L0 9 Z" fill="#FF6FA8"/>
<path d="M0 9 Q-4 14 -8 11 M0 9 Q4 14 8 11" stroke="#6B5A80" stroke-width="1.6" fill="none" stroke-linecap="round"/>
<path d="M-24 7 L-42 3 M-24 12 L-42 15 M24 7 L42 3 M24 12 L42 15" stroke="#6B5A80" stroke-width="1.3" stroke-linecap="round"/>
<circle cx="-23" cy="6" r="4" fill="#FF8FBE" opacity=".55"/><circle cx="23" cy="6" r="4" fill="#FF8FBE" opacity=".55"/></g></svg><h1>管理后台</h1></div><div class="card"><h2>输入管理员密码</h2>
    ${msg ? `<p style="color:var(--coral);font-size:13px">${msg}</p>` : ''}
    <div class="row"><input type="password" id="k" placeholder="ADMIN_KEY"><button class="primary" id="go">进入</button></div></div>`;
  document.getElementById('go').onclick = () => { key = document.getElementById('k').value.trim(); load(true); };
}

async function load(fromLogin){
  if(!key){ loginView(); return; }
  if(!shown){ try{ const c = JSON.parse(localStorage.getItem('adminData') || 'null'); if(c){ data = c; shown = true; render(); } }catch(e){} }
  try{
    const r = await api({action:'adminList'});
    if(r.error){ localStorage.removeItem('adminKey'); localStorage.removeItem('adminData'); shown = false; key = ''; loginView(fromLogin ? '密码不对' : ''); return; }
    localStorage.setItem('adminKey', key); data = r; shown = true; try{ localStorage.setItem('adminData', JSON.stringify(r)); }catch(e){} render();
  }catch(e){ if(fromLogin) loginView('连接失败,检查 API_URL'); }
}

function render(){
  const all = group(data.bookings);
  const tot = {pending:0, confirmed:0, rejected:0};
  data.bookings.forEach(b => { if(tot[b.status] !== undefined) tot[b.status]++; });
  const list = tab === 'pending' ? all.filter(s => s.c.pending > 0) : tab === 'done' ? all.filter(s => s.c.pending === 0) : all;
  const nPend = all.filter(s => s.c.pending > 0).length;
  app.innerHTML = `
    <div class="head"><svg viewBox="-46 -46 92 82" width="46" height="42" aria-hidden="true"><g transform="translate(0,0) scale(1)">
<path d="M-34 -6 L-30 -42 L-8 -27 Z" fill="#FFB3D1"/><path d="M34 -6 L30 -42 L8 -27 Z" fill="#FFB3D1"/>
<ellipse rx="37" ry="30" fill="#FFB3D1"/>
<circle cx="-13" cy="-3" r="3.2" fill="#6B5A80"/><circle cx="13" cy="-3" r="3.2" fill="#6B5A80"/>
<path d="M-3 5 L3 5 L0 9 Z" fill="#FF6FA8"/>
<path d="M0 9 Q-4 14 -8 11 M0 9 Q4 14 8 11" stroke="#6B5A80" stroke-width="1.6" fill="none" stroke-linecap="round"/>
<path d="M-24 7 L-42 3 M-24 12 L-42 15 M24 7 L42 3 M24 12 L42 15" stroke="#6B5A80" stroke-width="1.3" stroke-linecap="round"/>
<circle cx="-23" cy="6" r="4" fill="#FF8FBE" opacity=".55"/><circle cx="23" cy="6" r="4" fill="#FF8FBE" opacity=".55"/></g></svg><h1>猫咪预约后台</h1></div>
    <p class="sub">下面的数字按"天"统计。每个申请(系列)可以整个处理,也可以展开逐天处理。</p>
    <div class="stats">
      <div class="stat p"><div class="n">${tot.pending}</div><div class="l">待确认(天)</div></div>
      <div class="stat c"><div class="n">${tot.confirmed}</div><div class="l">已接受(天)</div></div>
      <div class="stat r"><div class="n">${tot.rejected}</div><div class="l">已拒绝(天)</div></div>
    </div>
    <div class="tabs">
      <div class="tab ${tab==='pending'?'active':''}" data-a="tab" data-t="pending">待处理 (${nPend})</div>
      <div class="tab ${tab==='done'?'active':''}" data-a="tab" data-t="done">已处理</div>
      <div class="tab ${tab==='all'?'active':''}" data-a="tab" data-t="all">全部 (${all.length})</div>
    </div>
    <div id="list">${list.length ? list.map(s => {
      const n = s.days.length, c = s.c;
      return `<div class="s">
        <div class="top"><div><div class="rng">${esc(s.name)}</div><div class="meta" style="margin:2px 0 0">${rng(s.start, s.end)}</div></div>
          <div>${c.pending ? `<span class="chip p">⏳ ${c.pending}</span>` : ''}${c.confirmed ? `<span class="chip c">✓ ${c.confirmed}</span>` : ''}${c.rejected ? `<span class="chip r">✕ ${c.rejected}</span>` : ''}</div></div>
        <div class="meta">共 ${n} 天 · ${freqTxt(s.freq, s.time)}</div>
        ${s.note ? `<div class="note">📝 ${esc(s.note)}</div>` : ''}
        <div class="acts">
          <button class="ok" data-a="series" data-sid="${s.sid}" data-s="confirmed">✓ 整个系列接受</button>
          <button class="no" data-a="series" data-sid="${s.sid}" data-s="rejected">✕ 整个系列拒绝</button>
          <button class="del" data-a="delseries" data-sid="${s.sid}">删除</button>
        </div>
        ${n > 1 ? `<details data-sid="${s.sid}" ${openSet.has(s.sid) ? 'open' : ''}><summary>逐天处理(${n} 天)</summary>
          ${s.days.map(d => `<div class="day"><span>${wd(d.date)} <span class="badge ${d.status}">${stTxt(d.status)}</span></span>
            <span class="mini">${d.status !== 'confirmed' ? `<button class="ok" data-a="day" data-id="${d.id}" data-s="confirmed">✓</button>` : ''}${d.status !== 'rejected' ? `<button class="no" data-a="day" data-id="${d.id}" data-s="rejected">✕</button>` : ''}${d.status !== 'pending' ? `<button data-a="day" data-id="${d.id}" data-s="pending">↺</button>` : ''}</span></div>`).join('')}</details>` : ''}
      </div>`;
    }).join('') : '<div class="empty">这里没有预约 🐾</div>'}</div>
    <div class="card" style="margin-top:22px">
      <h2>猫咪主人(每人一个专属链接)</h2>
      <div class="row" style="margin-bottom:8px"><input type="text" id="newName" placeholder="新客户名字,如 Lisa"><button class="primary" data-a="addc">添加</button></div>
      ${data.clients.length ? data.clients.map(cl => `<div class="cl"><span>🐱 ${esc(cl.name)}</span><button data-a="copy" data-tk="${cl.token}">复制链接</button></div>`).join('') : '<div class="empty">还没有客户</div>'}
    </div>`;
}

app.addEventListener('toggle', e => { const d = e.target; if(!d.dataset || !d.dataset.sid) return; d.open ? openSet.add(d.dataset.sid) : openSet.delete(d.dataset.sid); }, true);
app.addEventListener('click', async e => {
  const b = e.target.closest('[data-a]'); if(!b) return;
  const a = b.dataset.a;
  if(a === 'tab'){ tab = b.dataset.t; render(); return; }
  if(a === 'copy'){
    const url = new URL('index.html?k=' + b.dataset.tk, location.href).href;
    try{ await navigator.clipboard.writeText(url); toast('链接已复制'); }catch(err){ prompt('复制这个链接:', url); }
    return;
  }
  if(a === 'addc'){
    const name = document.getElementById('newName').value.trim();
    if(!name){ toast('请填名字'); return; }
    const r = await api({action:'adminAddClient', name});
    toast(r.error ? '失败: ' + r.error : '已添加,点"复制链接"发给客户'); load(); return;
  }
  let r;
  if(a === 'day'){ r = await api({action:'adminSetStatus', id:b.dataset.id, status:b.dataset.s}); }
  else if(a === 'series'){
    const s = group(data.bookings).find(x => x.sid === b.dataset.sid);
    if(s && s.c.pending < s.days.length && !confirm('这个系列里有些天已经处理过了,确定把全部 ' + s.days.length + ' 天都改成"' + stTxt(b.dataset.s) + '"吗?')) return;
    r = await api({action:'adminSetSeries', sid:b.dataset.sid, status:b.dataset.s});
  }
  else if(a === 'delseries'){
    if(!confirm('确定删除这个系列的所有天数吗?')) return;
    r = await api({action:'adminDeleteSeries', sid:b.dataset.sid});
  } else return;
  toast(r.error ? '失败: ' + r.error : '已更新'); load();
});

load();
setInterval(() => { const f = document.getElementById('newName'); if(key && document.visibilityState === 'visible' && !(f && f.value)) load(); }, 60000);
</script></body></html>
