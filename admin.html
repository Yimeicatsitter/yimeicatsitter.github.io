<!DOCTYPE html>
<html lang="zh"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex"><title>猫咪预约 · 管理后台</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'"><style>
:root{color-scheme:light;
 --bg:#FFEAF3;--card:#FFFFFF;--text:#2B1F3D;--muted:#65547D;--border:#F0A9CB;--line:#E8C2D6;
 --pink:#E8408A;--pink2:#FF8FBE;--pinkSoft:#FFDDEC;--blue:#2F8FE0;--blueSoft:#D8EDFF;--blueText:#14609F;
 --yellow:#7A4E00;--yellowSoft:#FFE59A;--mint:#0A7555;--mintSoft:#C2F1DC;--coral:#B01C45;--coralSoft:#FFCFDB;--lilac:#8E5CF0;}
*{box-sizing:border-box}
html{background:var(--bg);scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;color:var(--text);font-family:"Nunito",-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Roboto,Helvetica,Arial,sans-serif;font-weight:600;font-size:16px;line-height:1.45;
 padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);-webkit-text-size-adjust:100%}
.bg{position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.8}
.wrap{max-width:540px;margin:0 auto;padding:22px 16px 70px}
.wrap.wide{max-width:700px}
.head{display:flex;align-items:center;gap:12px;margin-bottom:6px}
h1{font-size:26px;margin:0;color:var(--pink);font-weight:800;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:15px;margin:2px 0 18px;font-weight:600}
.card{background:rgba(255,255,255,.97);border:2.5px solid var(--border);border-radius:22px;padding:18px;margin-bottom:16px;box-shadow:0 8px 24px rgba(232,64,138,.12)}
.card h2{font-size:18px;margin:0 0 14px;color:var(--text);font-weight:800}
label{display:block;font-size:13.5px;font-weight:800;color:var(--muted);margin:0 0 6px}
.field{margin-bottom:14px}.two{display:flex;gap:10px}.two>*{flex:1;min-width:0}
input[type=date],input[type=text],input[type=password],textarea{width:100%;border:2.5px solid var(--border);background:#fff;color:var(--text);border-radius:14px;padding:12px;font-size:17px;font-family:inherit;font-weight:700;outline:none}
input:focus,textarea:focus{border-color:var(--pink);box-shadow:0 0 0 4px rgba(232,64,138,.15)}
.pills{display:flex;gap:8px;flex-wrap:wrap}
.pill{flex:1 1 0;min-width:92px;text-align:center;padding:12px 8px;border-radius:14px;border:2.5px solid var(--border);background:#fff;color:var(--text);font-size:15.5px;font-weight:800;cursor:pointer;user-select:none;transition:.12s}
.pill.active{background:var(--pink);border-color:var(--pink);color:#fff;box-shadow:0 4px 10px rgba(232,64,138,.35)}
.pill.blue.active{background:var(--blue);border-color:var(--blue);color:#fff;box-shadow:0 4px 10px rgba(47,143,224,.35)}
button{font-family:inherit;cursor:pointer}
.primary{width:100%;padding:16px;border:none;border-radius:16px;background:linear-gradient(135deg,#E8408A,#8E5CF0);color:#fff;font-size:18px;font-weight:800;box-shadow:0 8px 18px rgba(232,64,138,.38);transition:.12s}
.primary:active{transform:scale(.98)}.primary:disabled{opacity:.6}
.info{font-size:15px;color:var(--muted);margin:-4px 0 14px}
.info b{color:var(--pink);font-weight:800}
.sec{font-size:16px;font-weight:800;color:var(--pink);margin:24px 4px 10px}
.chip{display:inline-block;font-size:13.5px;font-weight:800;padding:4px 10px;border-radius:999px;margin:0 5px 5px 0}
.chip.p{background:var(--yellowSoft);color:var(--yellow)}.chip.c{background:var(--mintSoft);color:var(--mint)}.chip.r{background:var(--coralSoft);color:var(--coral)}
.badge{font-size:13.5px;font-weight:800;padding:5px 12px;border-radius:999px;white-space:nowrap}
.badge.pending{background:var(--yellowSoft);color:var(--yellow)}.badge.confirmed{background:var(--mintSoft);color:var(--mint)}
.badge.rejected{background:var(--coralSoft);color:var(--coral)}.badge.partial{background:var(--blueSoft);color:var(--blueText)}
.s{background:rgba(255,255,255,.97);border:2.5px solid var(--border);border-radius:20px;padding:15px 16px;margin-bottom:12px}
.s .top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.s .rng{font-weight:800;font-size:18px}.s .meta{font-size:15px;color:var(--muted);margin:4px 0 8px}
.s .note{font-size:14.5px;color:var(--muted);font-style:italic;margin-bottom:8px}
details{margin-top:6px}summary{cursor:pointer;font-size:15px;font-weight:800;color:var(--blueText);padding:5px 0;list-style:none}
summary::-webkit-details-marker{display:none}summary::before{content:"▸ "}details[open] summary::before{content:"▾ "}
.day{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 0;border-top:2px dashed var(--line);font-size:15.5px}
.mini{display:flex;gap:6px;align-items:center}
.mini button{min-width:38px;padding:7px 11px;border-radius:10px;border:2.5px solid var(--line);background:#fff;font-size:15px;font-weight:800;color:var(--muted)}
.mini .ok{background:#0E9A70;border-color:#0E9A70;color:#fff}.mini .no{background:#E23E6B;border-color:#E23E6B;color:#fff}
.ghost{margin-top:6px;background:#fff;border:2.5px solid var(--border);color:var(--text);border-radius:12px;padding:9px 14px;font-size:14.5px;font-weight:800}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 2px}
.acts button{flex:1 1 auto;padding:12px 12px;border-radius:12px;border:2.5px solid var(--line);background:#fff;color:var(--text);font-size:15px;font-weight:800}
.acts .ok{background:#0E9A70;border-color:#0E9A70;color:#fff}.acts .no{background:#E23E6B;border-color:#E23E6B;color:#fff}
.acts .del{flex:0 0 auto;color:var(--muted)}
.empty,.err{text-align:center;color:var(--muted);font-size:16px;padding:26px 10px;line-height:1.6}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:#1F2A44;color:#fff;padding:13px 22px;border-radius:999px;font-size:15.5px;font-weight:800;opacity:0;pointer-events:none;transition:.22s;max-width:90vw;text-align:center;z-index:9;box-shadow:0 8px 20px rgba(0,0,0,.25)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.stat{background:rgba(255,255,255,.96);border:2px solid var(--border);border-radius:18px;padding:12px;text-align:center}
.stat .n{font-size:28px;font-weight:800}.stat .l{font-size:13.5px;color:var(--muted);font-weight:700}
.stat.p .n{color:#B86E00}.stat.c .n{color:var(--mint)}.stat.r .n{color:var(--coral)}
.tabs{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto}
.tab{flex:0 0 auto;padding:10px 16px;border-radius:999px;border:2.5px solid var(--border);background:#fff;font-size:15px;font-weight:800;color:var(--text);cursor:pointer;white-space:nowrap}
.tab.active{background:linear-gradient(135deg,var(--pink),var(--lilac));border-color:transparent;color:#fff}
.row{display:flex;gap:8px}.row .primary{width:auto;padding:11px 18px;font-size:14px;flex:0 0 auto}
.cl{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:11px 0;border-top:2px dashed var(--line);font-size:17px;font-weight:700}
.cl button{padding:9px 14px;border-radius:12px;border:2.5px solid var(--blue);background:var(--blue);color:#fff;font-size:14.5px;font-weight:800}
.card,.s,.stat{background:rgba(255,255,255,.95)}
.calhead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.calhead h2{margin:0;font-size:20px;font-weight:800}
.navb{padding:9px 15px;border-radius:12px;border:2.5px solid var(--border);background:#fff;font-weight:800;font-size:16px;color:var(--text)}
.navb.today{background:var(--blue);border-color:var(--blue);color:#fff;font-size:14.5px}
.cgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cw{text-align:center;font-size:13.5px;font-weight:800;color:var(--muted);padding:4px 0}
.cd{min-height:80px;background:#fff;border:2px solid var(--line);border-radius:12px;padding:4px;overflow:hidden;cursor:pointer}
.cd.off{background:transparent;border-color:transparent;cursor:default}
.cd.today{border-color:var(--pink);border-width:2.5px}.cd.sel{background:var(--pinkSoft);border-color:var(--pink)}
.dn{font-size:14px;font-weight:800;margin-bottom:3px}.cd.today .dn{color:var(--pink)}
.cc{display:block;font-size:11px;font-weight:800;padding:1px 5px;border-radius:6px;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cc.pending{background:var(--yellowSoft);color:var(--yellow)}.cc.confirmed{background:#0E9A70;color:#fff}.cc.rejected{background:var(--coralSoft);color:var(--coral);text-decoration:line-through}
.cm{font-size:11.5px;color:var(--muted);font-weight:800}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:14px;font-weight:700;color:var(--muted);margin:12px 2px 14px}
.legend i{display:inline-block;width:13px;height:13px;border-radius:4px;margin-right:6px;vertical-align:-2px}
.dtitle{font-size:17px;font-weight:800;margin:0 0 6px}
@media (max-width:480px){.cd{min-height:70px;padding:3px}.cc{font-size:10px;padding:1px 3px}}
.hello{display:flex;align-items:center;gap:12px;margin:2px 0 16px}
.hello svg{width:64px;height:auto;flex:0 0 auto;filter:drop-shadow(0 4px 6px rgba(255,111,168,.25))}
.bubble{position:relative;background:#fff;border:2.5px solid var(--border);border-radius:18px;padding:11px 15px;font-size:16px;font-weight:800;color:var(--text);box-shadow:0 6px 16px rgba(255,111,168,.14)}
.bubble::before{content:"";position:absolute;left:-9px;top:50%;margin-top:-7px;border:7px solid transparent;border-left:0;border-right:9px solid var(--border)}
.stat{position:relative;margin-top:10px}
.stat::before,.stat::after{content:"";position:absolute;top:-10px;border:9px solid transparent;border-top:0;border-bottom:12px solid var(--ec)}
.stat::before{left:16px}.stat::after{right:16px}
.stat.p{--ec:#FFE07A}.stat.c{--ec:#8FE3C4}.stat.r{--ec:#FFA3B8}
.stat .ic{font-size:20px;display:block;margin-bottom:2px}
.s{border-left-width:8px}.s.sp{border-left-color:#FFD24D}.s.sc{border-left-color:#4FD1A5}.s.sr{border-left-color:#FF7C9C}
.av{display:inline-flex;width:34px;height:34px;border-radius:50%;align-items:center;justify-content:center;background:var(--pinkSoft);font-size:19px;margin-right:8px;vertical-align:middle}
.empty .big{font-size:44px;display:block;margin-bottom:6px}
</style></head>
<body><svg class="bg" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="100%" height="100%">

<circle cx="150" cy="120" r="4" fill="#B5F0D8"/><circle cx="20" cy="300" r="4" fill="#9AD4FF"/><circle cx="322" cy="34" r="4" fill="#FFB3D1"/><circle cx="118" cy="176" r="3" fill="#FFE49A"/>
</g></pattern></defs><rect width="100%" height="100%" fill="url(#cats)"/></svg>
<div class="wrap wide" id="app"></div><div class="toast" id="toast"></div>
<script>
const API_URL = "https://script.google.com/macros/s/AKfycbzcWLuB2Yz3xUYrJBfcbInXtJDDFjT-JjB6gk9QvvVLx3PCiwsvHFTt3brVtpcV4o4PWw/exec";
const app = document.getElementById('app');
let key = localStorage.getItem('adminKey') || '';
let data = {clients:[], bookings:[]}, tab = 'pending', shown = false, ops = 0;
const p2 = n => String(n).padStart(2, '0');
const isoOf = d => d.getFullYear() + '-' + p2(d.getMonth() + 1) + '-' + p2(d.getDate());
let calM = new Date(new Date().getFullYear(), new Date().getMonth(), 1), calSel = isoOf(new Date());
const openSet = new Set();

const esc = s => String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const fmt = iso => new Date(iso + 'T00:00:00').toLocaleDateString('zh-CN', {year:'numeric', month:'2-digit', day:'2-digit'});
const wd = iso => new Date(iso + 'T00:00:00').toLocaleDateString('zh-CN', {month:'2-digit', day:'2-digit', weekday:'short'});
const rng = (a,b) => a === b ? fmt(a) : fmt(a) + ' → ' + fmt(b);
const timeTxt = t => t === 'morning' ? '上午' : t === 'evening' ? '傍晚' : '时间不限(egal)';
const freqTxt = (f,t) => f === 'twice' ? '一天两次(上午+傍晚)' : '一天一次 · ' + timeTxt(t);
const stTxt = s => s === 'confirmed' ? '已接受' : s === 'rejected' ? '已拒绝' : '待确认';
function toast(t){ const el = document.getElementById('toast'); el.textContent = t; el.classList.add('show'); setTimeout(()=>el.classList.remove('show'), 2200); }
async function api(p){ const r = await fetch(API_URL + '?' + new URLSearchParams({...p, a:key})); return r.json(); }

const AV = ['🐱','😸','🐈','😻','🐯','😽','🐾','🦁'];
const av = n => AV[[...String(n)].reduce((h,ch) => (h*31 + ch.charCodeAt(0)) >>> 0, 7) % AV.length];
function group(list){
  const m = {};
  list.forEach(b => { const k = b.seriesId || b.id; (m[k] = m[k] || {sid:k, days:[]}).days.push(b); });
  return Object.values(m).map(s => {
    s.days.sort((a,b) => a.date.localeCompare(b.date));
    const f = s.days[0];
    s.start = f.date; s.end = s.days[s.days.length-1].date; s.freq = f.freq; s.time = f.time; s.note = f.note; s.name = f.clientName;
    s.c = {pending:0, confirmed:0, rejected:0};
    s.days.forEach(d => { if(s.c[d.status] !== undefined) s.c[d.status]++; });
    return s;
  }).sort((a,b) => a.start.localeCompare(b.start));
}

function calHTML(){
  const y = calM.getFullYear(), m = calM.getMonth(), by = {};
  data.bookings.forEach(x => { (by[x.date] = by[x.date] || []).push(x); });
  const order = {pending:0, confirmed:1, rejected:2};
  const lead = (new Date(y, m, 1).getDay() + 6) % 7, dim = new Date(y, m + 1, 0).getDate(), cells = [];
  for(let i = 0; i < lead; i++) cells.push(null);
  for(let d = 1; d <= dim; d++) cells.push(d);
  while(cells.length % 7) cells.push(null);
  const todayIso = isoOf(new Date());
  let grid = ['一','二','三','四','五','六','日'].map(w => `<div class="cw">${w}</div>`).join('');
  cells.forEach(d => {
    if(d === null){ grid += '<div class="cd off"></div>'; return; }
    const key = y + '-' + p2(m + 1) + '-' + p2(d), l = (by[key] || []).slice().sort((a, c) => order[a.status] - order[c.status]);
    const chips = l.slice(0, 3).map(x => `<span class="cc ${x.status}">${esc([...String(x.clientName)].slice(0, 5).join(''))}</span>`).join('');
    grid += `<div class="cd ${key === todayIso ? 'today' : ''} ${key === calSel ? 'sel' : ''}" data-a="calday" data-date="${key}"><div class="dn">${d}</div>${chips}${l.length > 3 ? `<span class="cm">+${l.length - 3}</span>` : ''}</div>`;
  });
  const sel = (by[calSel] || []).slice().sort((a, c) => order[a.status] - order[c.status]);
  const detail = calSel ? `<div class="card" style="margin-top:14px"><div class="dtitle">${fmt(calSel)} · 共 ${sel.length} 个预约</div>` +
    (sel.length ? sel.map(x => `<div class="day"><span><span class="av">${av(x.clientName)}</span>${esc(x.clientName)} · ${freqTxt(x.freq, x.time)} <span class="badge ${x.status}">${stTxt(x.status)}</span>${x.note ? `<div class="note" style="margin:4px 0 0">📝 ${esc(x.note)}</div>` : ''}</span>
      <span class="mini">${x.status !== 'confirmed' ? `<button class="ok" data-a="day" data-id="${x.id}" data-s="confirmed">✓</button>` : ''}${x.status !== 'rejected' ? `<button class="no" data-a="day" data-id="${x.id}" data-s="rejected">✕</button>` : ''}${x.status !== 'pending' ? `<button data-a="day" data-id="${x.id}" data-s="pending">↺</button>` : ''}</span></div>`).join('') : '<div class="empty" style="padding:14px">这天没有预约 😺</div>') + '</div>' : '';
  return `<div class="calhead"><button class="navb" data-a="calnav" data-d="-1">◀</button><h2>📅 ${calM.toLocaleDateString('zh-CN', {year:'numeric', month:'long'})}</h2>
    <span><button class="navb today" data-a="calnav" data-d="0">今天</button> <button class="navb" data-a="calnav" data-d="1">▶</button></span></div>
    <div class="legend"><span><i style="background:var(--yellowSoft);border:1.5px solid var(--yellow)"></i>待确认</span><span><i style="background:#0E9A70"></i>已接受</span><span><i style="background:var(--coralSoft);border:1.5px solid var(--coral)"></i>已拒绝</span></div>
    <div class="cgrid">${grid}</div>${detail}`;
}

function loginView(msg){
  app.innerHTML = `<div class="head"><svg viewBox="-46 -46 92 82" width="46" height="42" aria-hidden="true"><g transform="translate(0,0) scale(1)">
<path d="M-34 -6 L-30 -42 L-8 -27 Z" fill="#FFB3D1"/><path d="M34 -6 L30 -42 L8 -27 Z" fill="#FFB3D1"/>
<ellipse rx="37" ry="30" fill="#FFB3D1"/>
<circle cx="-13" cy="-3" r="3.2" fill="#6B5A80"/><circle cx="13" cy="-3" r="3.2" fill="#6B5A80"/>
<path d="M-3 5 L3 5 L0 9 Z" fill="#FF6FA8"/>
<path d="M0 9 Q-4 14 -8 11 M0 9 Q4 14 8 11" stroke="#6B5A80" stroke-width="1.6" fill="none" stroke-linecap="round"/>
<path d="M-24 7 L-42 3 M-24 12 L-42 15 M24 7 L42 3 M24 12 L42 15" stroke="#6B5A80" stroke-width="1.3" stroke-linecap="round"/>
<circle cx="-23" cy="6" r="4" fill="#FF8FBE" opacity=".55"/><circle cx="23" cy="6" r="4" fill="#FF8FBE" opacity=".55"/></g></svg><h1>管理后台</h1></div><div class="card"><h2>输入管理员密码</h2>
    ${msg ? `<p style="color:var(--coral);font-size:13px">${msg}</p>` : ''}
    <div class="row"><input type="password" id="k" placeholder="ADMIN_KEY"><button class="primary" id="go">进入</button></div></div>`;
  document.getElementById('go').onclick = () => { key = document.getElementById('k').value.trim(); load(true); };
}

async function load(fromLogin){
  if(ops > 0 && !fromLogin) return;
  if(!key){ loginView(); return; }
  if(!shown){ try{ const c = JSON.parse(localStorage.getItem('adminData') || 'null'); if(c){ data = c; shown = true; render(); } }catch(e){} }
  try{
    const r = await api({action:'adminList'});
    if(r.error){ localStorage.removeItem('adminKey'); localStorage.removeItem('adminData'); shown = false; key = ''; loginView(fromLogin ? '密码不对' : ''); return; }
    localStorage.setItem('adminKey', key); data = r; shown = true; try{ localStorage.setItem('adminData', JSON.stringify(r)); }catch(e){} render();
  }catch(e){ if(fromLogin) loginView('连接失败,检查 API_URL'); }
}

function render(){
  const all = group(data.bookings);
  const tot = {pending:0, confirmed:0, rejected:0};
  data.bookings.forEach(b => { if(tot[b.status] !== undefined) tot[b.status]++; });
  const list = tab === 'pending' ? all.filter(s => s.c.pending > 0) : tab === 'done' ? all.filter(s => s.c.pending === 0) : all;
  const nPend = all.filter(s => s.c.pending > 0).length;
  app.innerHTML = `
    <h1 style="margin:0 0 8px">猫咪预约后台 🐾</h1>
    <div class="hello"><svg viewBox="-46 -46 92 82" width="46" height="42" aria-hidden="true"><g transform="translate(0,0) scale(1)">
<path d="M-34 -6 L-30 -42 L-8 -27 Z" fill="#FFB3D1"/><path d="M34 -6 L30 -42 L8 -27 Z" fill="#FFB3D1"/>
<ellipse rx="37" ry="30" fill="#FFB3D1"/>
<circle cx="-13" cy="-3" r="3.2" fill="#6B5A80"/><circle cx="13" cy="-3" r="3.2" fill="#6B5A80"/>
<path d="M-3 5 L3 5 L0 9 Z" fill="#FF6FA8"/>
<path d="M0 9 Q-4 14 -8 11 M0 9 Q4 14 8 11" stroke="#6B5A80" stroke-width="1.6" fill="none" stroke-linecap="round"/>
<path d="M-24 7 L-42 3 M-24 12 L-42 15 M24 7 L42 3 M24 12 L42 15" stroke="#6B5A80" stroke-width="1.3" stroke-linecap="round"/>
<circle cx="-23" cy="6" r="4" fill="#FF8FBE" opacity=".55"/><circle cx="23" cy="6" r="4" fill="#FF8FBE" opacity=".55"/></g></svg><div class="bubble">${nPend ? '喵~ 有 <b style="color:var(--pink)">' + nPend + '</b> 个申请等你处理 🐾' : '喵~ 暂时没有待处理的申请,可以休息啦 😽'}</div></div>
    <div class="stats">
      <div class="stat p"><span class="ic">⏳</span><div class="n">${tot.pending}</div><div class="l">待确认(天)</div></div>
      <div class="stat c"><span class="ic">💚</span><div class="n">${tot.confirmed}</div><div class="l">已接受(天)</div></div>
      <div class="stat r"><span class="ic">🙈</span><div class="n">${tot.rejected}</div><div class="l">已拒绝(天)</div></div>
    </div>
    <div class="tabs">
      <div class="tab ${tab==='pending'?'active':''}" data-a="tab" data-t="pending">待处理 (${nPend})</div>
      <div class="tab ${tab==='cal'?'active':''}" data-a="tab" data-t="cal">📅 日历</div>
      <div class="tab ${tab==='done'?'active':''}" data-a="tab" data-t="done">已处理</div>
      <div class="tab ${tab==='all'?'active':''}" data-a="tab" data-t="all">全部 (${all.length})</div>
    </div>
    <div id="list">${tab === 'cal' ? calHTML() : list.length ? list.map(s => {
      const n = s.days.length, c = s.c;
      return `<div class="s ${c.pending ? 'sp' : (c.rejected === n ? 'sr' : 'sc')}">
        <div class="top"><div><div class="rng"><span class="av">${av(s.name)}</span>${esc(s.name)}</div><div class="meta" style="margin:2px 0 0">${rng(s.start, s.end)}</div></div>
          <div>${c.pending ? `<span class="chip p">⏳ ${c.pending}</span>` : ''}${c.confirmed ? `<span class="chip c">✓ ${c.confirmed}</span>` : ''}${c.rejected ? `<span class="chip r">✕ ${c.rejected}</span>` : ''}</div></div>
        <div class="meta">共 ${n} 天 · ${freqTxt(s.freq, s.time)}</div>
        ${s.note ? `<div class="note">📝 ${esc(s.note)}</div>` : ''}
        <div class="acts">
          <button class="ok" data-a="series" data-sid="${s.sid}" data-s="confirmed">🐾 整个系列接受</button>
          <button class="no" data-a="series" data-sid="${s.sid}" data-s="rejected">🙅 整个系列拒绝</button>
          <button class="del" data-a="delseries" data-sid="${s.sid}">删除</button>
        </div>
        ${n > 1 ? `<details data-sid="${s.sid}" ${openSet.has(s.sid) ? 'open' : ''}><summary>逐天处理(${n} 天)</summary>
          ${s.days.map(d => `<div class="day"><span>${wd(d.date)} <span class="badge ${d.status}">${stTxt(d.status)}</span></span>
            <span class="mini">${d.status !== 'confirmed' ? `<button class="ok" data-a="day" data-id="${d.id}" data-s="confirmed">✓</button>` : ''}${d.status !== 'rejected' ? `<button class="no" data-a="day" data-id="${d.id}" data-s="rejected">✕</button>` : ''}${d.status !== 'pending' ? `<button data-a="day" data-id="${d.id}" data-s="pending">↺</button>` : ''}</span></div>`).join('')}</details>` : ''}
      </div>`;
    }).join('') : '<div class="empty"><span class="big">😺</span>这里还没有预约,猫咪们都睡着啦 💤</div>'}</div>
    <div class="card" style="margin-top:22px">
      <h2>猫咪主人(每人一个专属链接)</h2>
      <div class="row" style="margin-bottom:8px"><input type="text" id="newName" placeholder="新客户名字,如 Lisa"><button class="primary" data-a="addc">添加</button></div>
      ${data.clients.length ? data.clients.map(cl => `<div class="cl"><span>🐱 ${esc(cl.name)}</span><button data-a="copy" data-tk="${cl.token}">复制链接</button></div>`).join('') : '<div class="empty">还没有客户</div>'}
    </div>`;
}

app.addEventListener('toggle', e => { const d = e.target; if(!d.dataset || !d.dataset.sid) return; d.open ? openSet.add(d.dataset.sid) : openSet.delete(d.dataset.sid); }, true);
app.addEventListener('click', async e => {
  const b = e.target.closest('[data-a]'); if(!b) return;
  const a = b.dataset.a;
  if(a === 'tab'){ tab = b.dataset.t; render(); return; }
  if(a === 'calnav'){ const dd = +b.dataset.d; calM = dd === 0 ? new Date(new Date().getFullYear(), new Date().getMonth(), 1) : new Date(calM.getFullYear(), calM.getMonth() + dd, 1); if(dd === 0) calSel = isoOf(new Date()); render(); return; }
  if(a === 'calday'){ calSel = b.dataset.date; render(); return; }
  if(a === 'copy'){
    const url = new URL('index.html?k=' + b.dataset.tk, location.href).href;
    try{ await navigator.clipboard.writeText(url); toast('链接已复制'); }catch(err){ prompt('复制这个链接:', url); }
    return;
  }
  if(a === 'addc'){
    const name = document.getElementById('newName').value.trim();
    if(!name){ toast('请填名字'); return; }
    const token = (crypto.randomUUID ? crypto.randomUUID() : (Date.now().toString(16) + Math.random().toString(16).slice(2) + '00000000000000000000')).replace(/-/g, '').slice(0, 32);
    const backup = data.clients;
    data.clients = data.clients.concat([{token, name}]); render(); toast('已添加 ✓ 点"复制链接"发给客户');
    await run(async () => (await api({action:'adminAddClient', name, token})), () => { data.clients = backup; });
    return;
  }
  if(a === 'day'){
    const id = b.dataset.id, st = b.dataset.s, bk = data.bookings.find(x => x.id === id); if(!bk) return;
    const old = bk.status; bk.status = st; render(); toast(st === 'confirmed' ? '已接受 ✓' : st === 'rejected' ? '已拒绝 ✓' : '已恢复待确认');
    await run(() => api({action:'adminSetStatus', id, status:st}), () => { bk.status = old; });
  }
  else if(a === 'series'){
    const sid = b.dataset.sid, st = b.dataset.s;
    const s = group(data.bookings).find(x => x.sid === sid);
    if(s && s.c.pending < s.days.length && !confirm('这个系列里有些天已经处理过了,确定把全部 ' + s.days.length + ' 天都改成"' + stTxt(st) + '"吗?')) return;
    const olds = data.bookings.filter(x => (x.seriesId || x.id) === sid).map(x => [x, x.status]);
    olds.forEach(([x]) => x.status = st); render(); toast(st === 'confirmed' ? '整个系列已接受 ✓' : '整个系列已拒绝 ✓');
    await run(() => api({action:'adminSetSeries', sid, status:st}), () => olds.forEach(([x, o]) => x.status = o));
  }
  else if(a === 'delseries'){
    if(!confirm('确定删除这个系列的所有天数吗?')) return;
    const sid = b.dataset.sid, backup = data.bookings;
    data.bookings = data.bookings.filter(x => (x.seriesId || x.id) !== sid); render(); toast('已删除 ✓');
    await run(() => api({action:'adminDeleteSeries', sid}), () => { data.bookings = backup; });
  }
});

async function run(call, revert){
  ops++;
  try{ const r = await call(); if(r.error){ revert(); render(); toast('失败: ' + r.error + '(已还原)'); } }
  catch(e){ revert(); render(); toast('网络失败,已还原,请重试'); }
  ops--; if(!ops) load();
}

load();
setInterval(() => { const f = document.getElementById('newName'); if(key && document.visibilityState === 'visible' && !(f && f.value)) load(); }, 60000);
</script></body></html>
