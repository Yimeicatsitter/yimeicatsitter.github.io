<!DOCTYPE html>
<html lang="zh"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex"><title>猫咪预约 · 管理后台</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'"><style>
:root{color-scheme:light;
 --bg:#FFF8FB;--card:#FFFFFF;--text:#4A3B5C;--muted:#8A7396;--border:#FFD3E6;--line:#FFE3F0;
 --pink:#E85DA0;--pink2:#FF9EC7;--pinkSoft:#FFDDEC;--blue:#2E8FD0;--blueSoft:#D6ECFF;--blueText:#0B4A78;
 --yellow:#7A5900;--yellowSoft:#FFE49A;--mint:#0E5C3B;--mintSoft:#C9F2DE;--coral:#9C1F52;--coralSoft:#FFB3D1;--lilac:#B79CFF;}
*{box-sizing:border-box}
html{background:var(--bg);scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;color:var(--text);font-family:"Nunito",-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Roboto,Helvetica,Arial,sans-serif;font-weight:600;font-size:16px;line-height:1.45;
 padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);-webkit-text-size-adjust:100%}
.bg{position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.8}
.wrap{max-width:540px;margin:0 auto;padding:22px 16px 70px}
.wrap.wide{max-width:700px}
.head{display:flex;align-items:center;gap:12px;margin-bottom:6px}
h1{font-size:26px;margin:0;color:var(--pink);font-weight:800;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:15px;margin:2px 0 18px;font-weight:600}
.card{background:rgba(255,255,255,.97);border:2.5px solid var(--border);border-radius:22px;padding:18px;margin-bottom:16px;box-shadow:0 8px 24px rgba(232,93,160,.12)}
.card h2{font-size:18px;margin:0 0 14px;color:var(--text);font-weight:800}
label{display:block;font-size:13.5px;font-weight:800;color:var(--muted);margin:0 0 6px}
.field{margin-bottom:14px}.two{display:flex;gap:10px}.two>*{flex:1;min-width:0}
input[type=date],input[type=text],input[type=password],textarea{width:100%;border:2.5px solid var(--border);background:#fff;color:var(--text);border-radius:14px;padding:12px;font-size:17px;font-family:inherit;font-weight:700;outline:none}
input:focus,textarea:focus{border-color:var(--pink);box-shadow:0 0 0 4px rgba(232,93,160,.15)}
.pills{display:flex;gap:8px;flex-wrap:wrap}
.pill{flex:1 1 0;min-width:92px;text-align:center;padding:12px 8px;border-radius:14px;border:2.5px solid var(--border);background:#fff;color:var(--text);font-size:15.5px;font-weight:800;cursor:pointer;user-select:none;transition:.12s}
.pill.active{background:var(--pink);border-color:var(--pink);color:#fff;box-shadow:0 4px 10px rgba(232,93,160,.35)}
.pill.blue.active{background:var(--blue);border-color:var(--blue);color:#fff;box-shadow:0 4px 10px rgba(46,143,208,.35)}
button{font-family:inherit;cursor:pointer}
.primary{width:100%;padding:16px;border:none;border-radius:16px;background:linear-gradient(135deg,#FF3D96,#8B5CF6);color:#fff;font-size:18px;font-weight:800;box-shadow:0 8px 18px rgba(255,61,150,.4);transition:.12s}
.primary:active{transform:scale(.98)}.primary:disabled{opacity:.6}
.info{font-size:15px;color:var(--muted);margin:-4px 0 14px}
.info b{color:var(--pink);font-weight:800}
.sec{font-size:16px;font-weight:800;color:var(--pink);margin:24px 4px 10px}
.chip{display:inline-block;font-size:13.5px;font-weight:800;padding:4px 10px;border-radius:999px;margin:0 5px 5px 0}
.chip.p{background:var(--yellowSoft);color:var(--yellow)}.chip.c{background:var(--mintSoft);color:var(--mint)}.chip.r{background:var(--coralSoft);color:var(--coral)}
.badge{font-size:13.5px;font-weight:800;padding:5px 12px;border-radius:999px;white-space:nowrap}
.badge.pending{background:var(--yellowSoft);color:var(--yellow)}.badge.confirmed{background:var(--mintSoft);color:var(--mint)}
.badge.rejected{background:var(--coralSoft);color:var(--coral)}.badge.partial{background:var(--blueSoft);color:var(--blueText)}
.s{background:rgba(255,255,255,.97);border:2.5px solid var(--border);border-radius:20px;padding:15px 16px;margin-bottom:12px}
.s .top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.s .rng{font-weight:800;font-size:18px}.s .meta{font-size:15px;color:var(--muted);margin:4px 0 8px}
.s .note{font-size:14.5px;color:var(--muted);font-style:italic;margin-bottom:8px}
details{margin-top:6px}summary{cursor:pointer;font-size:15px;font-weight:800;color:var(--blueText);padding:5px 0;list-style:none}
summary::-webkit-details-marker{display:none}summary::before{content:"▸ "}details[open] summary::before{content:"▾ "}
.day{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 0;border-top:2px dashed var(--line);font-size:15.5px}
.mini{display:flex;gap:6px;align-items:center}
.mini button{min-width:38px;padding:7px 11px;border-radius:10px;border:2.5px solid var(--line);background:#fff;font-size:15px;font-weight:800;color:var(--muted)}
.mini .ok{background:#0E9A70;border-color:#0E9A70;color:#fff}.mini .no{background:#E23E6B;border-color:#E23E6B;color:#fff}
.ghost{margin-top:6px;background:#fff;border:2.5px solid var(--border);color:var(--text);border-radius:12px;padding:9px 14px;font-size:14.5px;font-weight:800}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 2px}
.acts button{flex:1 1 auto;padding:12px 12px;border-radius:12px;border:2.5px solid var(--line);background:#fff;color:var(--text);font-size:15px;font-weight:800}
.acts .ok{background:#0E9A70;border-color:#0E9A70;color:#fff}.acts .no{background:#E23E6B;border-color:#E23E6B;color:#fff}
.acts .del{flex:0 0 auto;color:var(--muted)}
.empty,.err{text-align:center;color:var(--muted);font-size:16px;padding:26px 10px;line-height:1.6}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:#1F2A44;color:#fff;padding:13px 22px;border-radius:999px;font-size:15.5px;font-weight:800;opacity:0;pointer-events:none;transition:.22s;max-width:90vw;text-align:center;z-index:9;box-shadow:0 8px 20px rgba(0,0,0,.25)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

:root{
 --bgc1:#FFB3D1;--bgc2:#A8DAFF;--bgc3:#D6EEFF;--bgc4:#FFE49A;--bgc5:#D9C2FF;
 --bgc6:#FF9EC7;--bgc7:#9AD4FF;--bgc8:#FFC94D;--bgc9:#B5F0D8;
 --noseColor:#FF6FA8;--cheekColor:#FF8FBE;
}
html[data-theme="xmas"]{
 --bgc1:#DD8087;--bgc2:#3FA76B;--bgc3:#EAF7EE;--bgc4:#E8B23D;--bgc5:#FFFFFF;
 --bgc6:#D42A3C;--bgc7:#2E7D5B;--bgc8:#E8B23D;--bgc9:#FFFFFF;
 --noseColor:#C81E2D;--cheekColor:#F0C15A;
 --bg:#F3FAF6;--card:#FFFFFF;--pink:#D42A3C;--pink2:#E8646F;--pinkSoft:#FCE1E3;
 --blue:#2E7D5B;--blueSoft:#DFF3E7;--blueText:#0B4A2E;--lilac:#C9A227;--border:#F3C7CB;--line:#F6D8DA;
}
html[data-theme="xmas"] .primary{background:linear-gradient(135deg,#D42A3C,#C9A227)!important;box-shadow:0 8px 18px rgba(212,42,60,.35)!important}

html[data-theme="halloween"]{
 --bgc1:#E8823D;--bgc2:#8B5FBF;--bgc3:#F0E6FA;--bgc4:#4A4550;--bgc5:#FFFFFF;
 --bgc6:#E8823D;--bgc7:#8B5FBF;--bgc8:#F0C15A;--bgc9:#FFFFFF;
 --noseColor:#5A2A6B;--cheekColor:#F5B87A;
 --bg:#FFF6EC;--card:#FFFFFF;--pink:#D9631A;--pink2:#E8823D;--pinkSoft:#FCE3C4;
 --blue:#6B3FA0;--blueSoft:#EDE0F7;--blueText:#4A2E72;--lilac:#3D2B4F;--border:#F5D9B8;--line:#F8E6D0;
}
html[data-theme="halloween"] .primary{background:linear-gradient(135deg,#D9631A,#3D2B4F)!important;box-shadow:0 8px 18px rgba(217,99,26,.35)!important}

html[data-theme="spring"]{
 --bgc1:#FFB7C5;--bgc2:#8FCB7E;--bgc3:#EAFBE4;--bgc4:#FFEE9E;--bgc5:#D8BFFF;
 --bgc6:#FFAFC2;--bgc7:#8FCB7E;--bgc8:#FFEE9E;--bgc9:#FFE3EC;
 --noseColor:#FF7A93;--cheekColor:#FFD1DC;
 --bg:#FFF6F8;--card:#FFFFFF;--pink:#E8607E;--pink2:#FF8FA8;--pinkSoft:#FFE1E8;
 --blue:#4C9A45;--blueSoft:#E3F5DE;--blueText:#2E6B2A;--lilac:#7BC96F;--border:#FFD3DE;--line:#FFE3EA;
}
html[data-theme="spring"] .primary{background:linear-gradient(135deg,#FF6F91,#7BC96F)!important;box-shadow:0 8px 18px rgba(255,111,145,.35)!important}

html[data-theme="summer"]{
 --bgc1:#FF9B85;--bgc2:#A8D8E8;--bgc3:#E3F5FB;--bgc4:#FFE07A;--bgc5:#A8E8D0;
 --bgc6:#FFAA90;--bgc7:#A8D8E8;--bgc8:#FFE07A;--bgc9:#F0FBFF;
 --noseColor:#E8654A;--cheekColor:#FFE7A8;
 --bg:#EFFAFF;--card:#FFFFFF;--pink:#1E8FB5;--pink2:#4FADCB;--pinkSoft:#D8F0F8;
 --blue:#3FA0C4;--blueSoft:#DCF1F7;--blueText:#1B5A73;--lilac:#FFCB6B;--border:#CDEAF5;--line:#DFF3FA;
}
html[data-theme="summer"] .primary{background:linear-gradient(135deg,#2FA8CC,#FFCB6B)!important;box-shadow:0 8px 18px rgba(47,168,204,.35)!important}

html[data-theme="autumn"]{
 --bgc1:#E8935A;--bgc2:#C9584A;--bgc3:#FBEAD9;--bgc4:#C9A66B;--bgc5:#E8B23D;
 --bgc6:#E8935A;--bgc7:#C9584A;--bgc8:#E8B23D;--bgc9:#FBEAD9;
 --noseColor:#8B3A2B;--cheekColor:#F0C89A;
 --bg:#FFF7ED;--card:#FFFFFF;--pink:#A34A1F;--pink2:#C9684A;--pinkSoft:#F5DEC4;
 --blue:#8B5A2B;--blueSoft:#F0E0C8;--blueText:#6B3A16;--lilac:#E8B23D;--border:#F0D3B0;--line:#F5E2C8;
}
html[data-theme="autumn"] .primary{background:linear-gradient(135deg,#C9584A,#E8B23D)!important;box-shadow:0 8px 18px rgba(201,88,74,.35)!important}

html[data-theme="winter"]{
 --bgc1:#C3E6F0;--bgc2:#FFFFFF;--bgc3:#E8F6FB;--bgc4:#C7D0F0;--bgc5:#E0F5F0;
 --bgc6:#C3E6F0;--bgc7:#F0F8FF;--bgc8:#C7D0F0;--bgc9:#FFFFFF;
 --noseColor:#E8A8AE;--cheekColor:#D6EEF7;
 --bg:#F7FBFD;--card:#FFFFFF;--pink:#4A8AA6;--pink2:#6FA8C0;--pinkSoft:#E3F2F8;
 --blue:#5FA8C4;--blueSoft:#E3F2F8;--blueText:#2E5A70;--lilac:#B8C4EA;--border:#DCEDF3;--line:#E8F4F8;
}
html[data-theme="winter"] .primary{background:linear-gradient(135deg,#5FA8C4,#B8C4EA)!important;box-shadow:0 8px 18px rgba(95,168,196,.35)!important}

.seasonBtn{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:10px;z-index:6;width:32px;height:32px;border-radius:50%;
 border:1.5px solid var(--border);background:#fff;display:flex;align-items:center;justify-content:center;font-size:15px;cursor:pointer;
 opacity:.8;box-shadow:0 3px 8px rgba(0,0,0,.1);padding:0}
.seasonBtn:active{transform:scale(.9)}
.langBtn{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:10px;z-index:6;width:32px;height:32px;border-radius:50%;
 border:1.5px solid var(--border);background:#fff;display:flex;align-items:center;justify-content:center;font-size:15px;cursor:pointer;
 opacity:.8;box-shadow:0 3px 8px rgba(0,0,0,.1);padding:0}
.langBtn:active{transform:scale(.9)}
.seasonPreviewRow{display:flex;gap:6px;flex-wrap:wrap;margin:2px 0 14px}
.seasonMini{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--border);background:#fff;font-size:14px;cursor:pointer;
 display:flex;align-items:center;justify-content:center;opacity:.75;padding:0}
.seasonMini.active{opacity:1;border-color:var(--pink);box-shadow:0 0 0 2px var(--pinkSoft)}
.confetti-piece{position:fixed;pointer-events:none;z-index:999;will-change:transform,opacity;animation:confettiUp .85s ease-out forwards}
.banner{width:100%;display:block;border-radius:16px;overflow:hidden;margin-bottom:14px;box-shadow:0 4px 14px rgba(0,0,0,.06)}
.banner svg{display:block;width:100%;height:auto}
html[data-theme] .bg{display:none}
@keyframes confettiUp{0%{transform:translate(-50%,-50%) scale(.5) rotate(0deg);opacity:1}100%{transform:translate(calc(-50% + var(--dx)),calc(-50% - 95px)) scale(1.15) rotate(var(--rot));opacity:0}}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.stat{background:rgba(255,255,255,.96);border:2px solid var(--border);border-radius:18px;padding:12px;text-align:center}
.stat .n{font-size:28px;font-weight:800}.stat .l{font-size:13.5px;color:var(--muted);font-weight:700}
.stat.p .n{color:#B86E00}.stat.c .n{color:var(--mint)}.stat.r .n{color:var(--coral)}
.tabs{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto}
.tab{flex:0 0 auto;padding:10px 16px;border-radius:999px;border:2.5px solid var(--border);background:#fff;font-size:15px;font-weight:800;color:var(--text);cursor:pointer;white-space:nowrap}
.tab.active{background:linear-gradient(135deg,var(--pink),var(--lilac));border-color:transparent;color:#fff}
.row{display:flex;gap:8px}.row .primary{width:auto;padding:11px 18px;font-size:14px;flex:0 0 auto}
.cl{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:11px 0;border-top:2px dashed var(--line);font-size:17px;font-weight:700}
.cl button{padding:9px 14px;border-radius:12px;border:2.5px solid var(--blue);background:var(--blue);color:#fff;font-size:14.5px;font-weight:800}
.card,.s,.stat{background:rgba(255,255,255,.95)}
.calhead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.calhead h2{margin:0;font-size:20px;font-weight:800}
.navb{padding:9px 15px;border-radius:12px;border:2.5px solid var(--border);background:#fff;font-weight:800;font-size:16px;color:var(--text)}
.navb.today{background:var(--blue);border-color:var(--blue);color:#fff;font-size:14.5px}
.cgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cw{text-align:center;font-size:13.5px;font-weight:800;color:var(--muted);padding:4px 0}
.cd{min-height:80px;background:#fff;border:2px solid var(--line);border-radius:12px;padding:4px;overflow:hidden;cursor:pointer}
.cd.off{background:transparent;border-color:transparent;cursor:default}
.cd.today{border-color:var(--pink);border-width:2.5px}.cd.sel{background:var(--pinkSoft);border-color:var(--pink)}
.dn{font-size:14px;font-weight:800;margin-bottom:3px}.cd.today .dn{color:var(--pink)}
.cc{display:block;font-size:11px;font-weight:800;padding:1px 5px;border-radius:6px;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cc.pending{background:var(--yellowSoft);color:var(--yellow)}.cc.confirmed{background:#0E9A70;color:#fff}.cc.rejected{background:var(--coralSoft);color:var(--coral);text-decoration:line-through}
.cm{font-size:11.5px;color:var(--muted);font-weight:800}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:14px;font-weight:700;color:var(--muted);margin:12px 2px 14px}
.legend i{display:inline-block;width:13px;height:13px;border-radius:4px;margin-right:6px;vertical-align:-2px}
.dtitle{font-size:17px;font-weight:800;margin:0 0 6px}
@media (max-width:480px){.cd{min-height:70px;padding:3px}.cc{font-size:10px;padding:1px 3px}}
.hello{display:flex;align-items:center;gap:12px;margin:2px 0 16px}
.hello svg{width:64px;height:auto;flex:0 0 auto;filter:drop-shadow(0 4px 6px rgba(255,111,168,.25))}
.bubble{position:relative;background:#fff;border:2.5px solid var(--border);border-radius:18px;padding:11px 15px;font-size:16px;font-weight:800;color:var(--text);box-shadow:0 6px 16px rgba(255,111,168,.14)}
.bubble::before{content:"";position:absolute;left:-9px;top:50%;margin-top:-7px;border:7px solid transparent;border-left:0;border-right:9px solid var(--border)}
.stat{position:relative;margin-top:10px}
.stat::before,.stat::after{content:"";position:absolute;top:-10px;border:9px solid transparent;border-top:0;border-bottom:12px solid var(--ec)}
.stat::before{left:16px}.stat::after{right:16px}
.stat.p{--ec:#FFE07A}.stat.c{--ec:#8FE3C4}.stat.r{--ec:#FFA3B8}
.stat .ic{font-size:20px;display:block;margin-bottom:2px}
.s{border-left-width:8px}.s.sp{border-left-color:#FFD24D}.s.sc{border-left-color:#4FD1A5}.s.sr{border-left-color:#FF7C9C}
.av{display:inline-flex;width:34px;height:34px;border-radius:50%;align-items:center;justify-content:center;background:var(--pinkSoft);font-size:19px;margin-right:8px;vertical-align:middle}
.empty .big{font-size:44px;display:block;margin-bottom:6px}
</style></head>

function celebrate(x, y){
  const parts = ['🐾','💖','✨','🐱','🎉'];
  for(let i = 0; i < 10; i++){
    const s = document.createElement('span');
    s.textContent = parts[Math.floor(Math.random() * parts.length)];
    s.className = 'confetti-piece';
    s.style.left = x + 'px'; s.style.top = y + 'px'; s.style.fontSize = (16 + Math.random() * 10) + 'px';
    s.style.setProperty('--dx', (Math.random() * 140 - 70) + 'px');
    s.style.setProperty('--rot', (Math.random() * 70 - 35) + 'deg');
    document.body.appendChild(s);
    setTimeout(() => s.remove(), 900);
  }
}

  const mand = mandatoryTheme(new Date());

let key = localStorage.getItem('adminKey') || '';
let data = {clients:[], bookings:[], blocked:[]}, tab = 'pending', shown = false, ops = 0;
const p2 = n => String(n).padStart(2, '0');
const isoOf = d => d.getFullYear() + '-' + p2(d.getMonth() + 1) + '-' + p2(d.getDate());
let calM = new Date(new Date().getFullYear(), new Date().getMonth(), 1), calSel = isoOf(new Date());
const openSet = new Set();

const esc = s => String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const fmt = iso => new Date(iso + 'T00:00:00').toLocaleDateString(ta().locale, {year:'numeric', month:'2-digit', day:'2-digit'});
const wd = iso => new Date(iso + 'T00:00:00').toLocaleDateString(ta().locale, {month:'2-digit', day:'2-digit', weekday:'short'});
const rng = (a,b) => a === b ? fmt(a) : fmt(a) + ' → ' + fmt(b);
const timeTxt = t => t === 'morning' ? ta().timeMorning : t === 'evening' ? ta().timeEvening : ta().timeAny;
const freqTxt = (f,t) => f === 'twice' ? ta().freqTwice : ta().freqOncePrefix + timeTxt(t);
const stTxt = s => s === 'confirmed' ? ta().stConfirmed : s === 'rejected' ? ta().stRejected : ta().stOpen;
function toast(t){ const el = document.getElementById('toast'); el.textContent = t; el.classList.add('show'); setTimeout(()=>el.classList.remove('show'), 2200); }
async function api(p){ const r = await fetch(API_URL + '?' + new URLSearchParams({...p, a:key})); return r.json(); }

function blockedGroups(list){
  const sorted = list.slice().sort((a, b) => a.date.localeCompare(b.date));
  const groups = [];
  sorted.forEach(b => {
    const prev = groups[groups.length - 1];
    const prevNext = prev ? new Date(prev.dates[prev.dates.length - 1] + 'T00:00:00Z').getTime() + 86400000 : null;
    if(prev && prev.note === b.note && new Date(b.date + 'T00:00:00Z').getTime() === prevNext){
      prev.dates.push(b.date);
    } else {
      groups.push({ note: b.note, dates: [b.date] });
    }
  });
  return groups.map(g => ({
    note: g.note,
    dates: g.dates,
    label: g.dates.length === 1 ? fmt(g.dates[0]) : fmt(g.dates[0]) + ' → ' + fmt(g.dates[g.dates.length - 1])
  }));
}

const AV = ['🐱','😸','🐈','😻','🐯','😽','🐾','🦁'];
const av = n => AV[[...String(n)].reduce((h,ch) => (h*31 + ch.charCodeAt(0)) >>> 0, 7) % AV.length];
function group(list){
  const m = {};
  list.forEach(b => { const k = b.seriesId || b.id; (m[k] = m[k] || {sid:k, days:[]}).days.push(b); });
  return Object.values(m).map(s => {
    s.days.sort((a,b) => a.date.localeCompare(b.date));
    const f = s.days[0];
    s.start = f.date; s.end = s.days[s.days.length-1].date; s.freq = f.freq; s.time = f.time; s.note = f.note; s.name = f.clientName;
    s.c = {pending:0, confirmed:0, rejected:0};
    s.days.forEach(d => { if(s.c[d.status] !== undefined) s.c[d.status]++; });
    s.cancelReq = s.days.filter(d => d.cancelRequested === '1' && d.status === 'confirmed').length;
    s.paidCount = s.days.filter(d => d.status === 'confirmed' && d.paid === '1').length;
    s.paidAll = s.c.confirmed > 0 && s.paidCount === s.c.confirmed;
    return s;
  }).sort((a,b) => a.start.localeCompare(b.start));
}

function calHTML(){
  const y = calM.getFullYear(), m = calM.getMonth(), by = {};
  data.bookings.forEach(x => { (by[x.date] = by[x.date] || []).push(x); });
  const blockedSet = new Set(data.blocked.map(x => x.date));
  const order = {pending:0, confirmed:1, rejected:2};
  const lead = (new Date(y, m, 1).getDay() + 6) % 7, dim = new Date(y, m + 1, 0).getDate(), cells = [];
  for(let i = 0; i < lead; i++) cells.push(null);
  for(let d = 1; d <= dim; d++) cells.push(d);
  while(cells.length % 7) cells.push(null);
  const todayIso = isoOf(new Date());
  const weekHead = langA === 'en' ? ['Mo','Tu','We','Th','Fr','Sa','Su'] : ['一','二','三','四','五','六','日'];
  let grid = weekHead.map(w => `<div class="cw">${w}</div>`).join('');
  cells.forEach(d => {
    if(d === null){ grid += '<div class="cd off"></div>'; return; }
    const key = y + '-' + p2(m + 1) + '-' + p2(d), l = (by[key] || []).slice().sort((a, c) => order[a.status] - order[c.status]), isBlocked = blockedSet.has(key);
    const chips = l.slice(0, 3).map(x => `<span class="cc ${x.status}">${esc([...String(x.clientName)].slice(0, 5).join(''))}</span>`).join('');
    grid += `<div class="cd ${key === todayIso ? 'today' : ''} ${key === calSel ? 'sel' : ''}" data-a="calday" data-date="${key}" style="${isBlocked ? 'background:var(--coralSoft)' : ''}"><div class="dn">${d}${isBlocked ? ' 🚫' : ''}</div>${chips}${l.length > 3 ? `<span class="cm">+${l.length - 3}</span>` : ''}</div>`;
  });
  const sel = (by[calSel] || []).slice().sort((a, c) => order[a.status] - order[c.status]);
  const selBlocked = calSel && blockedSet.has(calSel);
  const detail = calSel ? `<div class="card" style="margin-top:14px"><div class="dtitle">${fmt(calSel)} · ${ta().bookingsCount(sel.length)}${selBlocked ? ta().markedUnavail : ''}</div>` +
    (selBlocked ? `<button class="ghost" data-a="unblockRange" data-dates="${calSel}" style="margin-bottom:10px">${ta().removeThisDayUnavail}</button>` : '') +
    (sel.length ? sel.map(x => `<div class="day"><span><span class="av">${av(x.clientName)}</span>${esc(x.clientName)} · ${freqTxt(x.freq, x.time)} <span class="badge ${x.status}">${stTxt(x.status)}</span>${x.note ? `<div class="note" style="margin:4px 0 0">📝 ${esc(x.note)}</div>` : ''}</span>
      <span class="mini">${x.status !== 'confirmed' ? `<button class="ok" data-a="day" data-id="${x.id}" data-s="confirmed">✓</button>` : ''}${x.status !== 'rejected' ? `<button class="no" data-a="day" data-id="${x.id}" data-s="rejected">✕</button>` : ''}${x.status !== 'pending' ? `<button data-a="day" data-id="${x.id}" data-s="pending">↺</button>` : ''}</span></div>`).join('') : `<div class="empty" style="padding:14px">${ta().noBookingsThisDay}</div>`) + '</div>' : '';
  return `<div class="calhead"><button class="navb" data-a="calnav" data-d="-1">◀</button><h2>📅 ${calM.toLocaleDateString(ta().locale, {year:'numeric', month:'long'})}</h2>
    <span><button class="navb today" data-a="calnav" data-d="0">${ta().today}</button> <button class="navb" data-a="calnav" data-d="1">▶</button></span></div>
    <div class="legend"><span><i style="background:var(--yellowSoft);border:1.5px solid var(--yellow)"></i>${ta().legendOpen}</span><span><i style="background:#0E9A70"></i>${ta().legendConfirmed}</span><span><i style="background:var(--coralSoft);border:1.5px solid var(--coral)"></i>${ta().legendRejected}</span></div>
    <div class="cgrid">${grid}</div>${detail}`;
}

async function load(fromLogin){
  if(ops > 0 && !fromLogin) return;
  if(!key){ loginView(); return; }
  if(!shown){ try{ const c = JSON.parse(localStorage.getItem('adminData') || 'null'); if(c){ data = c; if(!data.blocked) data.blocked = []; shown = true; render(); } }catch(e){} }
  try{
    const r = await api({action:'adminList'});
    if(r.error){ localStorage.removeItem('adminKey'); localStorage.removeItem('adminData'); shown = false; key = ''; loginView(fromLogin ? ta().wrongPw : ''); return; }
    localStorage.setItem('adminKey', key); data = r; if(!data.blocked) data.blocked = []; shown = true; try{ localStorage.setItem('adminData', JSON.stringify(r)); }catch(e){} render();
  }catch(e){ if(fromLogin) loginView(ta().connFail); }
}

app.addEventListener('toggle', e => { const d = e.target; if(!d.dataset || !d.dataset.sid) return; d.open ? openSet.add(d.dataset.sid) : openSet.delete(d.dataset.sid); }, true);
app.addEventListener('click', async e => {
  const b = e.target.closest('[data-a]'); if(!b) return;
  const a = b.dataset.a;
  if(a === 'previewTheme'){
    const k = b.dataset.k;
    if(k) document.documentElement.dataset.theme = k; else delete document.documentElement.dataset.theme;
    try{ sessionStorage.setItem('themePreview', k); }catch(err){}
    render(); return;
  }
  if(a === 'tab'){ tab = b.dataset.t; render(); return; }
  if(a === 'calnav'){ const dd = +b.dataset.d; calM = dd === 0 ? new Date(new Date().getFullYear(), new Date().getMonth(), 1) : new Date(calM.getFullYear(), calM.getMonth() + dd, 1); if(dd === 0) calSel = isoOf(new Date()); render(); return; }
  if(a === 'calday'){ calSel = b.dataset.date; render(); return; }
  if(a === 'copy'){
    const url = new URL('index.html?k=' + b.dataset.tk, location.href).href;
    try{ await navigator.clipboard.writeText(url); toast(ta().toastLinkCopied); }catch(err){ prompt(ta().copyLink + ':', url); }
    return;
  }
  if(a === 'delclient'){
    const tk = b.dataset.tk, name = b.dataset.name;
    if(!confirm(ta().confirmDelClient(name))) return;
    const backupC = data.clients;
    data.clients = data.clients.filter(c => c.token !== tk);
    render(); toast(ta().toastDeletedSyncing(name));
    // 管理页看到的预约不带 token,没法在本地精确过滤,交给下面的 run() 触发真正的 load() 刷新为服务器最新数据
    await run(() => api({action:'adminDeleteClient', token:tk}), () => { data.clients = backupC; });
    return;
  }
  if(a === 'addc'){
    const name = document.getElementById('newName').value.trim();
    if(!name){ toast(ta().toastNeedName); return; }
    const token = (crypto.randomUUID ? crypto.randomUUID() : (Date.now().toString(16) + Math.random().toString(16).slice(2) + '00000000000000000000')).replace(/-/g, '').slice(0, 32);
    const backup = data.clients;
    data.clients = data.clients.concat([{token, name}]); render(); toast(ta().toastAdded);
    await run(async () => (await api({action:'adminAddClient', name, token})), () => { data.clients = backup; });
    return;
  }
  if(a === 'day'){
    const id = b.dataset.id, st = b.dataset.s, bk = data.bookings.find(x => x.id === id); if(!bk) return;
    const r0 = b.getBoundingClientRect();
    const old = bk.status; bk.status = st; render(); toast(st === 'confirmed' ? ta().toastConfirmed : st === 'rejected' ? ta().toastRejected : ta().toastReverted);
    if(st === 'confirmed') celebrate(r0.left + r0.width / 2, r0.top + r0.height / 2);
    await run(() => api({action:'adminSetStatus', id, status:st}), () => { bk.status = old; });
  }
  else if(a === 'series'){
    const sid = b.dataset.sid, st = b.dataset.s;
    const s = group(data.bookings).find(x => x.sid === sid);
    if(s && s.c.pending < s.days.length && !confirm(ta().confirmSeriesChange(s.days.length, stTxt(st)))) return;
    const r0 = b.getBoundingClientRect();
    const olds = data.bookings.filter(x => (x.seriesId || x.id) === sid).map(x => [x, x.status]);
    olds.forEach(([x]) => x.status = st); render(); toast(st === 'confirmed' ? ta().toastSeriesConfirmed : ta().toastSeriesRejected);
    if(st === 'confirmed') celebrate(r0.left + r0.width / 2, r0.top + r0.height / 2);
    await run(() => api({action:'adminSetSeries', sid, status:st}), () => olds.forEach(([x, o]) => x.status = o));
  }
  else if(a === 'delseries'){
    if(!confirm(ta().confirmDelSeries)) return;
    const sid = b.dataset.sid, backup = data.bookings;
    data.bookings = data.bookings.filter(x => (x.seriesId || x.id) !== sid); render(); toast(ta().toastSeriesDeleted);
    await run(() => api({action:'adminDeleteSeries', sid}), () => { data.bookings = backup; });
  }
  else if(a === 'cancelApprove'){
    const sid = b.dataset.sid;
    if(!confirm(ta().confirmCancelApprove)) return;
    const backup = data.bookings;
    data.bookings = data.bookings.filter(x => !((x.seriesId || x.id) === sid && x.cancelRequested === '1' && x.status === 'confirmed'));
    render(); toast(ta().toastCancelApproved);
    await run(() => api({action:'adminApproveCancel', sid}), () => { data.bookings = backup; });
  }
  else if(a === 'cancelDeny'){
    const sid = b.dataset.sid;
    const olds = data.bookings.filter(x => (x.seriesId || x.id) === sid && x.cancelRequested === '1').map(x => [x, x.cancelRequested]);
    olds.forEach(([x]) => x.cancelRequested = ''); render(); toast(ta().toastCancelDenied);
    await run(() => api({action:'adminDenyCancel', sid}), () => olds.forEach(([x, o]) => x.cancelRequested = o));
  }
  else if(a === 'setPaid'){
    const sid = b.dataset.sid, paid = b.dataset.paid;
    const olds = data.bookings.filter(x => (x.seriesId || x.id) === sid && x.status === 'confirmed').map(x => [x, x.paid]);
    olds.forEach(([x]) => x.paid = paid); render(); toast(paid === '1' ? ta().toastMarkedPaid : ta().toastMarkedUnpaid);
    await run(() => api({action:'adminSetPaid', sid, paid}), () => olds.forEach(([x, o]) => x.paid = o));
  }
  else if(a === 'blockRange'){
    const start = document.getElementById('blockStart').value, end = document.getElementById('blockEnd').value || start;
    const note = document.getElementById('blockNote').value.trim();
    if(!start){ toast(ta().toastNeedStart); return; }
    if(end < start){ toast(ta().toastEndBeforeStart); return; }
    const backup = data.blocked;
    const added = [];
    let d = new Date(start + 'T00:00:00Z'); const e = new Date(end + 'T00:00:00Z');
    while(d <= e){ const iso = d.toISOString().slice(0, 10); if(!data.blocked.some(x => x.date === iso)) added.push({date: iso, note}); d = new Date(d.getTime() + 86400000); }
    data.blocked = data.blocked.concat(added); render(); toast(ta().toastMarkedUnavail);
    await run(() => api({action:'adminBlockRange', start, end, note}), () => { data.blocked = backup; });
  }
  else if(a === 'unblockRange'){
    const dates = b.dataset.dates.split(',');
    const backup = data.blocked;
    data.blocked = data.blocked.filter(x => dates.indexOf(x.date) < 0); render(); toast(ta().toastRemoved);
    await run(() => Promise.all(dates.map(date => api({action:'adminUnblockDate', date}))).then(rs => rs.find(r => r.error) || {ok:true}),
      () => { data.blocked = backup; });
  }
});

async function run(call, revert){
  ops++;
  try{ const r = await call(); if(r.error){ revert(); render(); toast(ta().toastFail(r.error)); } }
  catch(e){ revert(); render(); toast(ta().toastNetFail); }
  ops--; if(!ops) load();
}

load();
setInterval(() => { const f = document.getElementById('newName'); if(key && document.visibilityState === 'visible' && !(f && f.value)) load(); }, 60000);
</script></body></html>
