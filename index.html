<!DOCTYPE html>

<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'"><style>
:root{color-scheme:light;
 --bg:#FFF8FB;--card:#FFFFFF;--text:#4A3B5C;--muted:#8A7396;--border:#FFD3E6;--line:#FFE3F0;
 --pink:#E85DA0;--pink2:#FF9EC7;--pinkSoft:#FFDDEC;--blue:#2E8FD0;--blueSoft:#D6ECFF;--blueText:#0B4A78;
 --yellow:#7A5900;--yellowSoft:#FFE49A;--mint:#0E5C3B;--mintSoft:#C9F2DE;--coral:#9C1F52;--coralSoft:#FFB3D1;--lilac:#B79CFF;}
*{box-sizing:border-box}
html{background:var(--bg);scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;color:var(--text);font-family:"Nunito",-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Roboto,Helvetica,Arial,sans-serif;font-weight:600;font-size:16px;line-height:1.45;
 padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);-webkit-text-size-adjust:100%}
.bg{position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.8}
.wrap{max-width:540px;margin:0 auto;padding:22px 16px 70px}
.wrap.wide{max-width:700px}
.head{display:flex;align-items:center;gap:12px;margin-bottom:6px}
h1{font-size:26px;margin:0;color:var(--pink);font-weight:800;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:15px;margin:2px 0 18px;font-weight:600}
.card{background:rgba(255,255,255,.97);border:2.5px solid var(--border);border-radius:22px;padding:18px;margin-bottom:16px;box-shadow:0 8px 24px rgba(232,93,160,.12)}
.card h2{font-size:18px;margin:0 0 14px;color:var(--text);font-weight:800}
label{display:block;font-size:13.5px;font-weight:800;color:var(--muted);margin:0 0 6px}
.field{margin-bottom:14px}.two{display:flex;gap:10px}.two>*{flex:1;min-width:0}
input[type=date],input[type=text],input[type=password],textarea{width:100%;border:2.5px solid var(--border);background:#fff;color:var(--text);border-radius:14px;padding:12px;font-size:17px;font-family:inherit;font-weight:700;outline:none}
input:focus,textarea:focus{border-color:var(--pink);box-shadow:0 0 0 4px rgba(232,93,160,.15)}
.pills{display:flex;gap:8px;flex-wrap:wrap}
.pill{flex:1 1 0;min-width:92px;text-align:center;padding:12px 8px;border-radius:14px;border:2.5px solid var(--border);background:#fff;color:var(--text);font-size:15.5px;font-weight:800;cursor:pointer;user-select:none;transition:.12s}
.pill.active{background:var(--pink);border-color:var(--pink);color:#fff;box-shadow:0 4px 10px rgba(232,93,160,.35)}
.pill.blue.active{background:var(--blue);border-color:var(--blue);color:#fff;box-shadow:0 4px 10px rgba(46,143,208,.35)}
button{font-family:inherit;cursor:pointer}
.primary{width:100%;padding:16px;border:none;border-radius:16px;background:linear-gradient(135deg,#FF3D96,#8B5CF6);color:#fff;font-size:18px;font-weight:800;box-shadow:0 8px 18px rgba(255,61,150,.4);transition:.12s}
.primary:active{transform:scale(.98)}.primary:disabled{opacity:.6}
.info{font-size:15px;color:var(--muted);margin:-4px 0 14px}
.info b{color:var(--pink);font-weight:800}
.sec{font-size:16px;font-weight:800;color:var(--pink);margin:24px 4px 10px}
.chip{display:inline-block;font-size:13.5px;font-weight:800;padding:4px 10px;border-radius:999px;margin:0 5px 5px 0}
.chip.p{background:var(--yellowSoft);color:var(--yellow)}.chip.c{background:var(--mintSoft);color:var(--mint)}.chip.r{background:var(--coralSoft);color:var(--coral)}
.badge{font-size:13.5px;font-weight:800;padding:5px 12px;border-radius:999px;white-space:nowrap}
.badge.pending{background:var(--yellowSoft);color:var(--yellow)}.badge.confirmed{background:var(--mintSoft);color:var(--mint)}
.badge.rejected{background:var(--coralSoft);color:var(--coral)}.badge.partial{background:var(--blueSoft);color:var(--blueText)}
.s{background:rgba(255,255,255,.97);border:2.5px solid var(--border);border-radius:20px;padding:15px 16px;margin-bottom:12px}
.s .top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.s .rng{font-weight:800;font-size:18px}.s .meta{font-size:15px;color:var(--muted);margin:4px 0 8px}
.s .note{font-size:14.5px;color:var(--muted);font-style:italic;margin-bottom:8px}
details{margin-top:6px}summary{cursor:pointer;font-size:15px;font-weight:800;color:var(--blueText);padding:5px 0;list-style:none}
summary::-webkit-details-marker{display:none}summary::before{content:"▸ "}details[open] summary::before{content:"▾ "}
.day{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 0;border-top:2px dashed var(--line);font-size:15.5px}
.mini{display:flex;gap:6px;align-items:center}
.mini button{min-width:38px;padding:7px 11px;border-radius:10px;border:2.5px solid var(--line);background:#fff;font-size:15px;font-weight:800;color:var(--muted)}
.mini .ok{background:#0E9A70;border-color:#0E9A70;color:#fff}.mini .no{background:#E23E6B;border-color:#E23E6B;color:#fff}
.ghost{margin-top:6px;background:#fff;border:2.5px solid var(--border);color:var(--text);border-radius:12px;padding:9px 14px;font-size:14.5px;font-weight:800}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 2px}
.acts button{flex:1 1 auto;padding:12px 12px;border-radius:12px;border:2.5px solid var(--line);background:#fff;color:var(--text);font-size:15px;font-weight:800}
.acts .ok{background:#0E9A70;border-color:#0E9A70;color:#fff}.acts .no{background:#E23E6B;border-color:#E23E6B;color:#fff}
.acts .del{flex:0 0 auto;color:var(--muted)}
.empty,.err{text-align:center;color:var(--muted);font-size:16px;padding:26px 10px;line-height:1.6}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:#1F2A44;color:#fff;padding:13px 22px;border-radius:999px;font-size:15.5px;font-weight:800;opacity:0;pointer-events:none;transition:.22s;max-width:90vw;text-align:center;z-index:9;box-shadow:0 8px 20px rgba(0,0,0,.25)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

.seasonBtn{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:10px;z-index:6;width:32px;height:32px;border-radius:50%;
 border:1.5px solid var(--border);background:#fff;display:flex;align-items:center;justify-content:center;font-size:15px;cursor:pointer;

 display:flex;align-items:center;justify-content:center;opacity:.75;padding:0}
.seasonMini.active{opacity:1;border-color:var(--pink);box-shadow:0 0 0 2px var(--pinkSoft)}
.confetti-piece{position:fixed;pointer-events:none;z-index:999;will-change:transform,opacity;animation:confettiUp .85s ease-out forwards}
.banner{width:100%;display:block;border-radius:16px;overflow:hidden;margin-bottom:14px;box-shadow:0 4px 14px rgba(0,0,0,.06)}
.banner svg{display:block;width:100%;height:auto}
@keyframes confettiUp{0%{transform:translate(-50%,-50%) scale(.5) rotate(0deg);opacity:1}100%{transform:translate(calc(-50% + var(--dx)),calc(-50% - 95px)) scale(1.15) rotate(var(--rot));opacity:0}}

.navb.today{background:var(--blue);border-color:var(--blue);color:#fff;font-size:14.5px}
.cgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}

<script>
function mandatoryTheme(n){
  const m = n.getMonth() + 1, d = n.getDate();
  if(m === 12 || (m === 1 && d <= 6)) return 'xmas';
  if((m === 10 && d >= 20) || (m === 11 && d <= 2)) return 'halloween';
  return null;
}

function celebrate(x, y){
  const parts = ['🐾','💖','✨','🐱','🎉'];
  for(let i = 0; i < 10; i++){
    const s = document.createElement('span');
    s.textContent = parts[Math.floor(Math.random() * parts.length)];
    s.className = 'confetti-piece';
    s.style.left = x + 'px'; s.style.top = y + 'px'; s.style.fontSize = (16 + Math.random() * 10) + 'px';
    s.style.setProperty('--dx', (Math.random() * 140 - 70) + 'px');
    s.style.setProperty('--rot', (Math.random() * 70 - 35) + 'deg');
    document.body.appendChild(s);
    setTimeout(() => s.remove(), 900);
  }
}

const nDays = (a,b) => Math.round((new Date(b+'T00:00:00') - new Date(a+'T00:00:00')) / 86400000) + 1;
function toast(msgTxt){ const el = document.getElementById('toast'); el.textContent = msgTxt; el.classList.add('show'); setTimeout(()=>el.classList.remove('show'), 2600); }
async function api(p){ const r = await fetch(API_URL + '?' + new URLSearchParams({...p, _:Date.now()}), {cache:'no-store'}); return r.json(); }

function group(list){
  const m = {};
  list.forEach(b => { const k = b.seriesId || b.id; (m[k] = m[k] || {sid:k, days:[]}).days.push(b); });
  return Object.values(m).map(s => {
    s.days.sort((a,b) => a.date.localeCompare(b.date));
    const f = s.days[0];
    s.start = f.date; s.end = s.days[s.days.length-1].date; s.freq = f.freq; s.time = f.time; s.note = f.note;
    s.c = {pending:0, confirmed:0, rejected:0};
    s.days.forEach(d => { if(s.c[d.status] !== undefined) s.c[d.status]++; });
    s.cancelReq = s.days.filter(d => d.cancelRequested === '1' && d.status === 'confirmed').length;
    return s;
  }).sort((a,b) => b.start.localeCompare(a.start));
}

async function load(){
  if(ops > 0) return;
  if(!K){ app.innerHTML = `<div class="err">${t().linkErr}</div>`; return; }
  if(!built){ try{ const c = JSON.parse(localStorage.getItem('c_' + K) || 'null'); if(c){ name = c.name; days = c.bookings; blocked = c.blocked || []; render(); } }catch(e){} }
  try{
    const r = await api({action:'list', k:K});
    if(r.error){ localStorage.removeItem('c_' + K); built = false; app.innerHTML = `<div class="err">${t().invalidLink}</div>`; return; }
    name = r.name; days = r.bookings; blocked = r.blocked || []; try{ localStorage.setItem('c_' + K, JSON.stringify(r)); }catch(e){}
    render();
  }catch(e){ if(!built) app.innerHTML = `<div class="err">${t().connErr}</div>`; }
}

function render(){
  if(!built){
    app.innerHTML = `
      <button class="langBtn" id="langBtn" title="${t().langBtnTitle}">${lang === 'de' ? '🇬🇧' : '🇩🇪'}</button>
      ${themeState.mode === 'choice'
        ? `<button class="seasonBtn" id="seasonBtn" title="${themeState.pref === 'season' ? t().seasonDefaultTitle : t().seasonLabels[themeState.season]}">${themeState.pref === 'season' ? '🎀' : seasonEmoji(themeState.season)}</button>`
        : `<div class="seasonBtn" style="pointer-events:none;opacity:.55" title="${themeState.theme === 'xmas' ? t().xmasActive : t().halloweenActive}">${themeState.theme === 'xmas' ? '🎄' : '🎃'}</div>`}
      <div id="bannerBox"></div>
      <div class="head"><svg viewBox="-46 -46 92 82" width="46" height="42" aria-hidden="true"><g transform="translate(0,0) scale(1)">
<path d="M-34 -6 L-30 -42 L-8 -27 Z" fill="#FFB3D1"/><path d="M34 -6 L30 -42 L8 -27 Z" fill="#FFB3D1"/>
<ellipse rx="37" ry="30" fill="#FFB3D1"/>
<circle cx="-13" cy="-3" r="3.2" fill="#6B5A80"/><circle cx="13" cy="-3" r="3.2" fill="#6B5A80"/>
<path d="M-3 5 L3 5 L0 9 Z" fill="var(--noseColor)"/>
<path d="M0 9 Q-4 14 -8 11 M0 9 Q4 14 8 11" stroke="#6B5A80" stroke-width="1.6" fill="none" stroke-linecap="round"/>
<path d="M-24 7 L-42 3 M-24 12 L-42 15 M24 7 L42 3 M24 12 L42 15" stroke="#6B5A80" stroke-width="1.3" stroke-linecap="round"/>
<circle cx="-23" cy="6" r="4" fill="var(--cheekColor)" opacity=".55"/><circle cx="23" cy="6" r="4" fill="var(--cheekColor)" opacity=".55"/></g></svg><h1>${t().hello(esc(name))}</h1></div>
      <p class="sub">${t().subtitle}</p>
      <div class="card">
        <h2>${t().cardTitle}</h2>
        <div class="two">
          <div class="field"><label>${t().from}</label><input type="date" id="start" min="${today()}" value="${today()}"></div>
          <div class="field"><label>${t().to}</label><input type="date" id="end" min="${today()}" value="${today()}"></div>
        </div>
        <div class="info" id="info"></div>
        <div class="field"><label>${t().freqLabel}</label>
          <div class="pills" id="freq"><div class="pill active" data-v="once">${t().onceDay}</div><div class="pill" data-v="twice">${t().twiceDay}</div></div></div>
        <div class="field" id="timeF"><label>${t().timeLabel}</label>
          <div class="pills" id="time"><div class="pill blue active" data-v="morning">${t().morning}</div><div class="pill blue" data-v="evening">${t().evening}</div><div class="pill blue" data-v="any">${t().any}</div></div></div>
        <div class="field"><label>${t().noteLabel}</label><textarea id="note" rows="2" placeholder="${t().notePlaceholder}"></textarea></div>
        <button class="primary" id="send">${t().sendBtn}</button>
        <div class="notify" id="notifyBox" style="display:none">
          <div class="t">${t().notifyTitle}</div>
          <div class="nrow"><button class="nb wa" id="waBtn">WhatsApp</button><button class="nb ig" id="igBtn">Instagram</button></div>
        </div>
      </div>
      <div class="sec">${t().sec}</div>
      <div class="pills viewsw" id="view"><div class="pill active" data-v="list">${t().viewList}</div><div class="pill" data-v="cal">${t().viewCal}</div></div>
      <div id="list"></div>`;
    built = true;
    const start = document.getElementById('start'), end = document.getElementById('end');
    start.onchange = () => { if(end.value < start.value) end.value = start.value; end.min = start.value; info(); };
    end.onchange = info;
    document.getElementById('freq').onclick = e => { const p = e.target.closest('.pill'); if(!p) return; freq = p.dataset.v;
      [...p.parentNode.children].forEach(x => x.classList.toggle('active', x === p));
      document.getElementById('timeF').style.display = freq === 'twice' ? 'none' : ''; };
    document.getElementById('time').onclick = e => { const p = e.target.closest('.pill'); if(!p) return; time = p.dataset.v;
      [...p.parentNode.children].forEach(x => x.classList.toggle('active', x === p)); };
    document.getElementById('send').onclick = send;
    renderBanner();
    const lb = document.getElementById('langBtn');
    if(lb){ lb.onclick = () => {
      lang = lang === 'de' ? 'en' : 'de';
      try{ localStorage.setItem('lang_' + K, lang); }catch(err){}
      document.documentElement.lang = lang;
      built = false;
      render();
    }; }
    const sb = document.getElementById('seasonBtn');
    if(sb){ sb.onclick = () => {
      const next = themeState.pref === 'season' ? 'default' : 'season';
      try{ localStorage.setItem('themePref_' + K, next); }catch(err){}
      themeState = applyTheme();
      sb.textContent = themeState.pref === 'season' ? '🎀' : seasonEmoji(themeState.season);
      sb.title = themeState.pref === 'season' ? t().seasonDefaultTitle : t().seasonLabels[themeState.season];
      renderBanner();
    }; }
    document.getElementById('view').onclick = e => { const p = e.target.closest('.pill'); if(!p) return; view = p.dataset.v;
      [...p.parentNode.children].forEach(x => x.classList.toggle('active', x === p)); renderList(); };
    document.getElementById('waBtn').onclick = () => notify('wa');
    document.getElementById('igBtn').onclick = () => notify('ig');
    document.getElementById('list').addEventListener('toggle', e => {
      const d = e.target; if(!d.dataset || !d.dataset.sid) return; d.open ? openSet.add(d.dataset.sid) : openSet.delete(d.dataset.sid); }, true);
    document.getElementById('list').onclick = async e => {
      const nv = e.target.closest('[data-nav]');
      if(nv){ const dd = +nv.dataset.nav; calM = dd === 0 ? new Date(new Date().getFullYear(), new Date().getMonth(), 1) : new Date(calM.getFullYear(), calM.getMonth() + dd, 1); if(dd === 0) calSel = today(); renderList(); return; }
      const cd = e.target.closest('[data-day]'); if(cd){ calSel = cd.dataset.day; renderList(); return; }
      const pf = e.target.closest('[data-prefill]');
      if(pf){ const s = document.getElementById('start'), en = document.getElementById('end'); s.value = pf.dataset.prefill; en.min = s.value; en.value = s.value; info();
        s.scrollIntoView({behavior:'smooth', block:'center'}); toast(t().dateTakenToast); return; }
      const rc = e.target.closest('[data-reqcancel]');
      if(rc){
        if(!confirm(t().confirmReqCancel)) return;
        const sid = rc.dataset.reqcancel, backup = days.map(d => ({...d}));
        days.forEach(d => { if((d.seriesId || d.id) === sid && d.status === 'confirmed') d.cancelRequested = '1'; });
        renderList(); toast(t().toastCancelReqSent);
        ops++;
        let failed1 = false;
        try{ const r = await api({action:'requestCancel', k:K, sid}); if(r.error){ failed1 = true; days = backup; renderList(); toast(t().toastErr(r.error)); } }
        catch(err){ failed1 = true; days = backup; renderList(); toast(t().toastConnFail); }
        ops--; if(!ops && failed1) load();
        return;
      }
      const b = e.target.closest('[data-cancel]'); if(!b) return;
      if(!confirm(t().confirmWithdraw)) return;
      const sid = b.dataset.cancel, backup = days;
      days = days.filter(d => !((d.seriesId || d.id) === sid && d.status === 'pending'));
      renderList(); toast(t().toastWithdrawn);
      ops++;
      let failed2 = false;
      try{ const r = await api({action:'cancel', k:K, sid}); if(r.error){ failed2 = true; days = backup; renderList(); toast(t().toastErr(r.error)); } }
      catch(err){ failed2 = true; days = backup; renderList(); toast(t().toastConnFail); }
      ops--; if(!ops && failed2) load();
    };
    info();
  }
  renderList();
}

function info(){
  const a = document.getElementById('start').value, b = document.getElementById('end').value, el = document.getElementById('info');
  if(!a || !b || b < a){ el.textContent = ''; return; }
  const n = nDays(a,b);
  el.innerHTML = (n === 1 ? t().days1 : `${t().daysN(n)} (${rng(a,b)})`) + (n > 62 ? t().maxNote : '');
}

const p2 = n => String(n).padStart(2, '0');
function calHTML(){
  if(!calSel) calSel = today();
  const y = calM.getFullYear(), m = calM.getMonth(), by = {}, order = {pending:0, confirmed:1, rejected:2};
  days.forEach(x => { (by[x.date] = by[x.date] || []).push(x); });
  const blockedSet = new Set(blocked.map(x => x.date));
  const lead = (new Date(y, m, 1).getDay() + 6) % 7, dim = new Date(y, m + 1, 0).getDate(), cells = [];
  for(let i = 0; i < lead; i++) cells.push(null);
  for(let d = 1; d <= dim; d++) cells.push(d);
  while(cells.length % 7) cells.push(null);
  let grid = t().weekdaysShort.map(w => `<div class="cw">${w}</div>`).join('');
  cells.forEach(d => {
    if(d === null){ grid += '<div class="cd off"></div>'; return; }
    const key = y + '-' + p2(m + 1) + '-' + p2(d), l = (by[key] || []).slice().sort((a, c) => order[a.status] - order[c.status]), isBlocked = blockedSet.has(key);
    grid += `<div class="cd ${key === today() ? 'today' : ''} ${key === calSel ? 'sel' : ''}" data-day="${key}" style="${isBlocked ? 'background:var(--coralSoft);opacity:.7' : ''}"><div class="dn" style="${isBlocked ? 'text-decoration:line-through' : ''}">${d}</div>` +
      l.slice(0, 2).map(x => `<span class="cc ${x.status}">${t().cshort(x)}</span>`).join('') + (l.length > 2 ? `<span class="cm">+${l.length - 2}</span>` : '') + '</div>';
  });
  const sel = (by[calSel] || []).slice().sort((a, c) => order[a.status] - order[c.status]);
  const selBlocked = blockedSet.has(calSel);
  const detail = `<div class="card" style="margin-top:14px"><div class="dtitle">${wd(calSel)} · ${sel.length ? sel.length + ' ' + (sel.length === 1 ? t().entry : t().entries) : t().noEntries}${selBlocked ? ' · 🚫 ' + t().legendBlocked : ''}</div>` +
    sel.map(x => `<div class="day"><span>${freqTxt(x.freq, x.time)}${x.note ? `<div class="meta" style="margin:3px 0 0">📝 ${esc(x.note)}</div>` : ''}</span><span class="badge ${x.status}">${stTxt(x.status)}</span></div>`).join('') +
    (calSel >= today() && !selBlocked ? `<button class="ghost" data-prefill="${calSel}" style="margin-top:10px">${t().requestThisDay}</button>` : '') + '</div>';
  return `<div class="calhead"><button class="navb" data-nav="-1">◀</button><h2>${calM.toLocaleDateString(t().locale, {month:'long', year:'numeric'})}</h2>
    <span><button class="navb today" data-nav="0">${t().today}</button> <button class="navb" data-nav="1">▶</button></span></div>
    <div class="legend"><span><i style="background:var(--yellowSoft);border:1.5px solid var(--yellow)"></i>${t().legendOpen}</span><span><i style="background:#0E9A70"></i>${t().legendConfirmed}</span><span><i style="background:var(--coralSoft);border:1.5px solid var(--coral)"></i>${t().legendRejected}</span><span><i style="background:var(--coralSoft)"></i>${t().legendBlocked}</span></div>
    <div class="cgrid">${grid}</div>${detail}`;
}

function renderList(){
  const nb = document.getElementById('notifyBox'); if(nb) nb.style.display = justSent ? '' : 'none';
  const list = document.getElementById('list');
  if(view === 'cal'){ list.innerHTML = calHTML(); return; }
  const series = group(days);
  if(!series.length){ list.innerHTML = `<div class="empty">${t().emptyReqs}</div>`; return; }
  list.innerHTML = series.map(s => {
    const n = s.days.length, c = s.c;
    const [cls, txt] = c.pending === n ? ['pending', t().stOpen] : c.confirmed === n ? ['confirmed', t().stConfirmed] : c.rejected === n ? ['rejected', t().stRejected] : ['partial', t().stPartial];
    return `<div class="s">
      <div class="top"><div class="rng">${rng(s.start, s.end)}</div><div class="badge ${cls}">${txt}</div></div>
      <div class="meta">${n} ${n === 1 ? t().day : t().dayPl} · ${freqTxt(s.freq, s.time)}</div>
      ${s.note ? `<div class="note">📝 ${esc(s.note)}</div>` : ''}
      <div>${c.confirmed ? `<span class="chip c">${t().chipConfirmed(c.confirmed)}</span>` : ''}${c.rejected ? `<span class="chip r">${t().chipRejected(c.rejected)}</span>` : ''}${c.pending ? `<span class="chip p">${t().chipOpen(c.pending)}</span>` : ''}</div>
      ${n > 1 ? `<details data-sid="${s.sid}" ${openSet.has(s.sid) ? 'open' : ''}><summary>${t().detailsToggle}</summary>
        ${s.days.map(d => `<div class="day"><span>${wd(d.date)}</span><span class="badge ${d.status}">${stTxt(d.status)}${d.cancelRequested === '1' ? ' ⏳' : ''}</span></div>`).join('')}</details>` : ''}
      ${(() => {
        if(String(s.sid).indexOf('tmp') === 0) return `<div class="meta" style="margin:8px 0 0">${t().savingNote}</div>`;
        const parts = [];
        if(c.pending) parts.push(`<button class="ghost" data-cancel="${s.sid}">${t().withdrawBtn}</button>`);
        if(c.confirmed - s.cancelReq > 0) parts.push(`<button class="ghost" data-reqcancel="${s.sid}" style="margin-top:6px">${t().reqCancelBtn}</button>`);
        if(s.cancelReq > 0) parts.push(`<div class="meta" style="margin-top:6px;color:var(--blueText)">${t().cancelReqNote(s.cancelReq)}</div>`);
        return parts.join('');
      })()}
    </div>`;
  }).join('');
}

function msg(){
  const a = document.getElementById('start').value, b = document.getElementById('end').value, note = document.getElementById('note').value.trim();
  return t().shareMsg(name, rng(a,b), nDays(a,b), freqTxt(freq, time), note);
}
function validDates(){
  const a = document.getElementById('start').value, b = document.getElementById('end').value;
  if(!a || !b){ toast(t().pickDate); return false; }
  if(b < a){ toast(t().endBeforeStart); return false; }
  if(nDays(a,b) > 62){ toast(t().maxDays); return false; }
  return true;
}
function valid(){
  if(!validDates()) return false;
  const a = document.getElementById('start').value, b = document.getElementById('end').value;
  const dupe = days.find(d => d.status !== 'rejected' && d.date >= a && d.date <= b);
  if(dupe){ toast(t().dupe(fmt(dupe.date), stTxt(dupe.status))); return false; }
  const block = blocked.find(x => x.date >= a && x.date <= b);
  if(block){ toast(t().blockedDate(fmt(block.date))); return false; }
  return true;
}
function notify(kind){
  // 这里只检查日期本身合不合法（选没选、范围对不对），
  // 不查"是否已经预约过"——发消息只是额外通知一下 Yimei，
  // 不是再交一次预约，不该被"重复预约"的检查拦下来。
  if(!validDates()) return;
  const text = msg();
  if(kind === 'wa'){ window.open('https://wa.me/' + WA + '?text=' + encodeURIComponent(text), '_blank'); return; }
  if(navigator.clipboard) navigator.clipboard.writeText(text).catch(()=>{});
  toast(t().igToast);
  window.open('https://ig.me/m/' + IG, '_blank');
}
function eachDay(a, z){ const out = []; let d = new Date(a + 'T00:00:00Z'); const e = new Date(z + 'T00:00:00Z'); while(d <= e){ out.push(d.toISOString().slice(0,10)); d = new Date(d.getTime() + 86400000); } return out; }
async function send(){
  if(!valid()) return;
  if(sending) return;
  const btn = document.getElementById('send');
  sending = true; btn.disabled = true; btn.style.opacity = '.6';
  const start = document.getElementById('start').value, end = document.getElementById('end').value, note = document.getElementById('note').value.trim();
  const f = freq, tm = f === 'twice' ? 'any' : time, sid = 'tmp' + Date.now();
  const added = eachDay(start, end).map((d, i) => ({id:'tmp' + i + sid, seriesId:sid, date:d, freq:f, time:tm, note, status:'pending'}));
  days = days.concat(added); justSent = true; renderList(); document.getElementById('note').value = '';
  toast(t().toastSent);
  const r0 = btn.getBoundingClientRect(); celebrate(r0.left + r0.width / 2, r0.top + r0.height / 2);
  ops++;
  let failedSend = false;
  try{
    const r = await api({action:'add', k:K, start, end, freq:f, time:tm, note});
    if(r.error){ failedSend = true; days = days.filter(d => d.seriesId !== sid); renderList(); toast(t().toastErr(r.error)); }
    else if(r.items){
      // 把服务器真正生成的记录（带真实 id）换掉本地那批临时占位的，不用整页重新拉取
      days = days.filter(d => d.seriesId !== sid).concat(r.items);
      renderList();
    }
  }catch(e){ failedSend = true; days = days.filter(d => d.seriesId !== sid); renderList(); toast(t().toastConnFailResend); }
  finally{ sending = false; btn.disabled = false; btn.style.opacity = ''; }
  ops--; if(!ops && failedSend) load();
}
load(); setInterval(() => { if(document.visibilityState === 'visible') load(); }, 60000);
document.addEventListener('visibilitychange', () => { if(document.visibilityState === 'visible' && built) load(); });
</script></body></html>
