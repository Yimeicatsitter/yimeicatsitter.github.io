<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Katzenbetreuung – Meine Buchungen</title>
<style>
  :root{--bg:#faf6f0;--card:#fff;--text:#2b2420;--muted:#8a7f74;--border:#e7ddd0;--accent:#c07a4a;--accent-dark:#a3623a;--accent-soft:#f3e3d4;
    --pending:#c99a2e;--pending-soft:#faf0d8;--confirmed:#4a7c59;--confirmed-soft:#e3f0e6;--rejected:#b3493f;--rejected-soft:#f8e3e0;}
  @media (prefers-color-scheme: dark){:root{--bg:#1c1712;--card:#26201a;--text:#f2ece3;--muted:#a89a89;--border:#3a3128;--accent:#e0955f;--accent-dark:#c07a4a;--accent-soft:#3a2c1f;
    --pending:#e0b84a;--pending-soft:#3a331c;--confirmed:#7fb894;--confirmed-soft:#233a29;--rejected:#e0857a;--rejected-soft:#3a2320;}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
  .wrap{max-width:480px;margin:0 auto;padding:24px 18px 60px}
  h1{font-size:21px;margin:0 0 4px}
  .sub{color:var(--muted);font-size:14px;margin:0 0 20px}
  .card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:18px;margin-bottom:18px}
  .card h2{font-size:15px;margin:0 0 14px}
  label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin:0 0 5px;text-transform:uppercase;letter-spacing:.03em}
  .field{margin-bottom:14px}
  input[type=date],textarea{width:100%;border:1.5px solid var(--border);background:var(--bg);color:var(--text);border-radius:12px;padding:12px;font-size:16px;font-family:inherit}
  .pills{display:flex;gap:8px}
  .pill{flex:1;text-align:center;padding:12px 8px;border-radius:12px;border:1.5px solid var(--border);background:var(--bg);font-size:14px;font-weight:600;cursor:pointer;user-select:none}
  .pill.active{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-dark)}
  button.primary{width:100%;padding:14px;border:none;border-radius:12px;background:var(--accent);color:#fff;font-size:16px;font-weight:700;cursor:pointer}
  button.primary:disabled{opacity:.5}
  .sec{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;margin:8px 0 10px}
  .b{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px 16px;margin-bottom:10px}
  .b .top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
  .b .d{font-weight:700;font-size:15px}
  .b .m{font-size:13.5px;margin-top:6px}
  .b .n{font-size:13px;color:var(--muted);margin-top:4px;font-style:italic}
  .badge{font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;white-space:nowrap}
  .badge.pending{background:var(--pending-soft);color:var(--pending)}
  .badge.confirmed{background:var(--confirmed-soft);color:var(--confirmed)}
  .badge.rejected{background:var(--rejected-soft);color:var(--rejected)}
  .cancel{margin-top:10px;background:none;border:1.5px solid var(--border);color:var(--muted);border-radius:9px;padding:7px 12px;font-size:13px;cursor:pointer}
  .empty,.err{text-align:center;color:var(--muted);font-size:14px;padding:26px 10px;line-height:1.6}
  .toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:var(--confirmed);color:#fff;padding:11px 18px;border-radius:999px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:.25s}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="empty">Laden …</div></div>
<div class="toast" id="toast"></div>
<script>
const API_URL = "https://script.google.com/macros/s/AKfycbzcWLuB2Yz3xUYrJBfcbInXtJDDFjT-JjB6gk9QvvVLx3PCiwsvHFTt3brVtpcV4o4PWw/exec";

const K = new URLSearchParams(location.search).get('k');
const app = document.getElementById('app');
let name = '', bookings = [], freq = 'once', time = 'morning', formBuilt = false;

const esc = s => String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const pad = n => String(n).padStart(2,'0');
const today = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; };
const human = iso => new Date(iso + 'T00:00:00').toLocaleDateString('de-DE', {weekday:'short', day:'2-digit', month:'long', year:'numeric'});
const freqTxt = b => b.freq === 'twice' ? '2× am Tag (vormittags & abends)' : (b.time === 'evening' ? '1× abends' : '1× vormittags');
const statusTxt = s => s === 'confirmed' ? 'Bestätigt' : s === 'rejected' ? 'Abgelehnt' : 'Offen';

function toast(t){ const el = document.getElementById('toast'); el.textContent = t; el.classList.add('show'); setTimeout(()=>el.classList.remove('show'), 2500); }

async function api(params){
  const r = await fetch(API_URL + '?' + new URLSearchParams(params));
  return r.json();
}

async function load(){
  if(!K){ app.innerHTML = '<div class="err">Bitte öffne den persönlichen Link, den du von Yimei bekommen hast.</div>'; return; }
  try{
    const r = await api({action:'list', k:K});
    if(r.error){ app.innerHTML = '<div class="err">Dieser Link ist ungültig. Bitte frag Yimei nach einem neuen Link.</div>'; return; }
    name = r.name; bookings = r.bookings;
    render();
  }catch(e){
    if(!formBuilt) app.innerHTML = '<div class="err">Verbindung fehlgeschlagen. Bitte Seite neu laden.</div>';
  }
}

function render(){
  if(!formBuilt){
    app.innerHTML = `
      <h1>🐱 Hallo ${esc(name)}!</h1>
      <p class="sub">Hier kannst du Katzenbetreuung bei Yimei anfragen und den Status sehen.</p>
      <div class="card">
        <h2>Neue Anfrage</h2>
        <div class="field"><label>Datum</label><input type="date" id="date" min="${today()}" value="${today()}"></div>
        <div class="field"><label>Häufigkeit</label>
          <div class="pills" id="freq"><div class="pill active" data-v="once">1× am Tag</div><div class="pill" data-v="twice">2× am Tag</div></div></div>
        <div class="field" id="timeF"><label>Uhrzeit (ungefähr)</label>
          <div class="pills" id="time"><div class="pill active" data-v="morning">Vormittags</div><div class="pill" data-v="evening">Abends</div></div></div>
        <div class="field"><label>Notiz (optional)</label><textarea id="note" rows="2" placeholder="z. B. Schlüssel, Besonderheiten …"></textarea></div>
        <button class="primary" id="send">Anfrage senden</button>
      </div>
      <div class="sec">Meine Anfragen</div>
      <div id="list"></div>`;
    formBuilt = true;
    document.getElementById('freq').onclick = e => { const p = e.target.closest('.pill'); if(!p) return; freq = p.dataset.v;
      [...p.parentNode.children].forEach(x=>x.classList.toggle('active', x===p)); document.getElementById('timeF').style.display = freq==='twice' ? 'none' : ''; };
    document.getElementById('time').onclick = e => { const p = e.target.closest('.pill'); if(!p) return; time = p.dataset.v;
      [...p.parentNode.children].forEach(x=>x.classList.toggle('active', x===p)); };
    document.getElementById('send').onclick = send;
  }
  renderList();
}

function renderList(){
  const list = document.getElementById('list');
  if(!bookings.length){ list.innerHTML = '<div class="empty">Noch keine Anfragen.</div>'; return; }
  const sorted = bookings.slice().sort((a,b)=> b.date.localeCompare(a.date));
  list.innerHTML = sorted.map(b => `
    <div class="b">
      <div class="top"><div class="d">${human(b.date)}</div><div class="badge ${b.status}">${statusTxt(b.status)}</div></div>
      <div class="m">${freqTxt(b)}</div>
      ${b.note ? `<div class="n">📝 ${esc(b.note)}</div>` : ''}
      ${b.status === 'pending' ? `<button class="cancel" data-id="${b.id}">Anfrage zurückziehen</button>` : ''}
    </div>`).join('');
  list.querySelectorAll('.cancel').forEach(btn => btn.onclick = async () => {
    if(!confirm('Anfrage wirklich zurückziehen?')) return;
    btn.disabled = true;
    const r = await api({action:'cancel', k:K, id:btn.dataset.id});
    if(r.error) toast('Fehler: ' + r.error); else toast('Zurückgezogen');
    load();
  });
}

async function send(){
  const date = document.getElementById('date').value;
  if(!date){ toast('Bitte Datum wählen'); return; }
  const btn = document.getElementById('send'); btn.disabled = true; btn.textContent = 'Senden …';
  try{
    const r = await api({action:'add', k:K, date, freq, time, note: document.getElementById('note').value.trim()});
    if(r.error) toast('Fehler: ' + r.error); else { toast('Anfrage gesendet ✓'); document.getElementById('note').value = ''; }
  }catch(e){ toast('Verbindung fehlgeschlagen'); }
  btn.disabled = false; btn.textContent = 'Anfrage senden';
  load();
}

load();
setInterval(load, 30000);
</script>
</body>
</html>
